  --accent:#9C7A3C;          /* oro profundo (configurable) */
  --accent-soft:rgba(156,122,60,.10);
  --ok:#3E9B6A;              /* completado */
  --wait:#E0A83A;            /* pendiente */
  --alert:#C8503C;           /* requiere atención */
  --shadow-s:0 1px 2px rgba(23,22,20,.05);
  --shadow-m:0 2px 6px rgba(23,22,20,.05), 0 12px 28px -16px rgba(23,22,20,.22);
  --shadow-l:0 4px 10px rgba(23,22,20,.06), 0 26px 50px -22px rgba(23,22,20,.30);
  --r-card:22px;
  --r-row:14px;
  --r-btn:18px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --serif:ui-serif,"New York",Charter,"Iowan Old Style",Georgia,serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --tabbar:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    --canvas:#0E0E0D; --card:#1A1A18; --card-2:#211F1D;
    --ink:#F2F0EC; --ink-2:#98938A; --ink-3:#6B665E;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --accent:#DCBB76; --accent-soft:rgba(220,187,118,.12);
    --ok:#5FBE87; --wait:#E9B856; --alert:#E0705A;
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 2px 6px rgba(0,0,0,.35), 0 12px 28px -16px rgba(0,0,0,.7);
    --shadow-l:0 4px 10px rgba(0,0,0,.4), 0 26px 50px -22px rgba(0,0,0,.8);
  }
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--canvas); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,textarea{background:transparent;border:0;outline:none;width:100%}
::placeholder{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.tnum{font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ============================================================
   ESTRUCTURA DE PANTALLAS
   ============================================================ */
#app{min-height:100%;display:flex;flex-direction:column}
.view{display:none;flex:1;padding:calc(var(--safe-t) + 14px) 20px calc(var(--tabbar) + var(--safe-b) + 28px);max-width:640px;width:100%;margin:0 auto}
.view.on{display:block;animation:viewIn .28s cubic-bezier(.22,.9,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Barra fina de progreso del día, fija arriba */
#dayline{position:fixed;top:0;left:0;right:0;height:2px;background:var(--line);z-index:60}
#dayline i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.22,.9,.3,1)}

/* Encabezado de pantalla */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 20px}
.head h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em}
.head .sub{color:var(--ink-2);font-size:14px;margin-top:6px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:16px;margin-bottom:10px}
.back svg{width:16px;height:16px}
.txtbtn{color:var(--accent);font-size:16px}

/* ============================================================
   HOY  ·  el escenario de una sola tarea
   ============================================================ */
.hero{margin:4px 0 26px}
.hero h1{font-family:var(--serif);font-size:32px;line-height:1.08;margin:0;letter-spacing:-.02em}
.hero .meta{margin-top:8px;color:var(--ink-2);font-size:14px;display:flex;align-items:center;gap:8px}
.hero .meta b{font-weight:500;color:var(--ink-2)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--ink-3);flex:none}

.progress{margin:0 0 30px}
.progress .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .55s cubic-bezier(.22,.9,.3,1)}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.progress .pct{font-family:var(--serif);font-size:22px;letter-spacing:-.01em}

/* Pila de tarjetas: las fantasmas revelan cuánto falta */
.stage{position:relative;margin-bottom:26px}
.ghost{position:absolute;left:0;right:0;top:0;height:60px;border-radius:var(--r-card);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s)}
.ghost.g1{transform:translateY(-9px) scale(.955);opacity:.75}
.ghost.g2{transform:translateY(-17px) scale(.91);opacity:.45}
.card-next{position:relative;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-l);padding:26px 22px 22px;border:1px solid var(--line)}
.card-next .where{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.card-next .task{font-family:var(--serif);font-size:29px;line-height:1.2;letter-spacing:-.02em;margin:0 0 24px;word-break:break-word}
.btn-done{display:block;width:100%;background:var(--accent);color:#fff;border-radius:var(--r-btn);padding:17px;font-size:17px;font-weight:600;letter-spacing:-.01em;box-shadow:0 6px 18px -8px var(--accent);transition:transform .12s ease,filter .12s ease}
@media (prefers-color-scheme: dark){.btn-done{color:#14120E}}
.btn-done:active{transform:scale(.975);filter:brightness(.96)}
.btn-skip{display:block;width:100%;text-align:center;color:var(--ink-3);font-size:14px;padding:14px 0 2px}
.queue-note{text-align:center;color:var(--ink-3);font-size:13px;margin-top:18px}

/* Estados vacío / celebración */
.calm{text-align:center;padding:34px 20px 30px;background:var(--card);border-radius:var(--r-card);border:1px solid var(--line);box-shadow:var(--shadow-m)}
.calm img{width:56px;height:56px;border-radius:14px;opacity:.9;margin-bottom:14px}
.calm h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 6px}
.calm p{color:var(--ink-2);font-size:15px;margin:0}
.cheer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--card);border-radius:var(--r-card);border:1px solid var(--line);z-index:3;animation:cheerIn .3s cubic-bezier(.22,.9,.3,1)}
.cheer .mark{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cheer .mark svg{width:20px;height:20px}
.cheer span{font-family:var(--serif);font-size:19px}
@keyframes cheerIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* Animaciones de la pila */
.fly{animation:fly .34s cubic-bezier(.35,0,.6,1) forwards}
@keyframes fly{to{opacity:0;transform:translateY(-26px) scale(.97)}}
.rise{animation:rise .38s cubic-bezier(.22,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}

/* Recordatorios del spa */
.nudges{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.nudge{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-row);font-size:15px;color:var(--ink-2);box-shadow:var(--shadow-s)}
.nudge .sdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--wait)}
.nudge.alert .sdot{background:var(--alert)}

/* ============================================================
   LISTAS Y FILAS
   ============================================================ */
.section-label{margin:26px 0 10px}
.stack{display:flex;flex-direction:column;gap:10px}
.tile{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 16px;box-shadow:var(--shadow-s);text-align:left;width:100%;transition:transform .14s ease}
.tile:active{transform:scale(.988)}
.tile .emoji{font-size:22px;width:28px;text-align:center;flex:none}
.tile .body{flex:1;min-width:0}
.tile .body>span{display:block}
.tile .name{font-size:17px;font-weight:500;letter-spacing:-.01em}
.tile .meta{font-size:13px;color:var(--ink-3);margin-top:3px}
.tile .sdot{width:8px;height:8px;border-radius:50%;flex:none}
.sdot.ok{background:var(--ok)} .sdot.wait{background:var(--wait)} .sdot.alert{background:var(--alert)}
.tile .chev{color:var(--ink-3);width:8px;height:14px;flex:none}
.minibar{height:3px;border-radius:2px;background:var(--line);margin-top:9px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .45s cubic-bezier(.22,.9,.3,1)}

.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.room{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow-s);text-align:left;transition:transform .14s ease}
.room:active{transform:scale(.985)}
.room .name{font-size:16px;font-weight:500;letter-spacing:-.01em;margin-bottom:8px}
.room .state{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}

/* Fila de checklist */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-s);overflow:hidden}
.item{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);position:relative;touch-action:pan-y}
.item:last-child{border-bottom:0}
.item.dragging{z-index:5;box-shadow:var(--shadow-m);border-radius:var(--r-row);border-bottom-color:transparent}
.check{width:23px;height:23px;border-radius:50%;border:1.8px solid var(--line-2);flex:none;display:grid;place-items:center;transition:background .18s ease,border-color .18s ease,transform .18s cubic-bezier(.3,1.4,.5,1)}
.check svg{width:12px;height:12px;color:#fff;opacity:0;transform:scale(.5);transition:opacity .18s ease,transform .22s cubic-bezier(.3,1.5,.5,1)}
.item.done .check{background:var(--ok);border-color:var(--ok)}
.item.done .check svg{opacity:1;transform:none}
.item.done .label{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.item .label{flex:1;min-width:0;font-size:16.5px;letter-spacing:-.01em;transition:color .2s ease}
.item input.label{padding:2px 0}
.handle{width:26px;flex:none;display:grid;place-items:center;color:var(--ink-3);cursor:grab;touch-action:none}
.handle svg{width:15px;height:15px}
.del{width:26px;flex:none;display:grid;place-items:center;color:var(--alert)}
.del svg{width:17px;height:17px}
.add-row{display:flex;align-items:center;gap:13px;padding:14px 16px;color:var(--ink-3)}
.add-row .plus{width:23px;height:23px;border-radius:50%;border:1.8px dashed var(--line-2);display:grid;place-items:center;flex:none;color:var(--ink-3)}
.add-row input{font-size:16.5px}

.btn-big{display:block;width:100%;background:var(--accent);color:#fff;border-radius:var(--r-btn);padding:16px;font-size:17px;font-weight:600;margin-top:18px;box-shadow:0 6px 18px -8px var(--accent);transition:transform .12s ease}
@media (prefers-color-scheme: dark){.btn-big{color:#14120E}}
.btn-big:active{transform:scale(.985)}
.btn-ghost{display:block;width:100%;border:1px solid var(--line-2);border-radius:var(--r-btn);padding:15px;font-size:16px;margin-top:10px;color:var(--ink-2);background:var(--card)}
.btn-ghost.danger{color:var(--alert);border-color:transparent;background:transparent}

/* Buscador */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:14px;box-shadow:var(--shadow-s)}
.search svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.search input{font-size:16px}

/* Notas y compras */
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:15px 17px;box-shadow:var(--shadow-s);text-align:left;width:100%;transition:transform .14s ease}
.note:active{transform:scale(.99)}
.note .txt{font-size:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.note .when{font-size:12px;color:var(--ink-3);margin-top:9px;letter-spacing:.01em}
.buy{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 15px;box-shadow:var(--shadow-s);width:100%;text-align:left}
.buy .body{flex:1;min-width:0}
.buy .name{font-size:16.5px;font-weight:500;letter-spacing:-.01em}
.buy .meta{font-size:13px;color:var(--ink-3);margin-top:3px}
.buy .price{font-family:var(--serif);font-size:17px;color:var(--ink);flex:none}
.star{width:30px;height:30px;display:grid;place-items:center;flex:none;color:var(--ink-3);border-radius:50%}
.star.on{color:var(--accent)}
.star svg{width:17px;height:17px}
.empty{text-align:center;color:var(--ink-3);font-size:15px;padding:44px 20px;line-height:1.6}

/* Ajustes */
.field{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .k{color:var(--ink-2);font-size:15px;flex:none;min-width:104px}
.field input{text-align:right;font-size:16px}
.swatches{display:flex;gap:12px;padding:16px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line);transition:transform .16s ease}
.sw.on{border-color:var(--ink);transform:scale(1.06)}
.iconrow{display:flex;align-items:center;gap:14px;padding:14px 16px}
.iconrow img{width:52px;height:52px;border-radius:13px;box-shadow:var(--shadow-s)}
.fineprint{color:var(--ink-3);font-size:12.5px;line-height:1.6;text-align:center;margin:24px 6px 0}

/* ============================================================
   BARRA INFERIOR Y BOTÓN FLOTANTE
   ============================================================ */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
  padding-bottom:var(--safe-b);background:var(--canvas);background:color-mix(in srgb,var(--canvas) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line)}
#tabbar .inner{display:flex;width:100%;max-width:640px}
.tab{flex:1;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-3);transition:color .18s ease}
.tab svg{width:22px;height:22px}
.tab span{font-size:10.5px;letter-spacing:.01em}
.tab.on{color:var(--accent)}
.tab:active svg{transform:scale(.92)}

#fab{position:fixed;right:20px;bottom:calc(var(--tabbar) + var(--safe-b) + 18px);z-index:55;
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 26px -8px rgba(23,22,20,.5);transition:transform .16s cubic-bezier(.3,1.3,.5,1)}
@media (prefers-color-scheme: dark){#fab{color:#14120E}}
#fab svg{width:25px;height:25px}
#fab:active{transform:scale(.9)}

/* ============================================================
   HOJA INFERIOR (sheets) Y AVISOS
   ============================================================ */
#scrim{position:fixed;inset:0;background:rgba(10,9,8,.32);backdrop-filter:blur(2px);z-index:70;opacity:0;pointer-events:none;transition:opacity .26s ease}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--card);
  border-radius:26px 26px 0 0;padding:10px 20px calc(22px + var(--safe-b));
  box-shadow:0 -12px 40px -12px rgba(0,0,0,.3);transform:translateY(101%);
  transition:transform .34s cubic-bezier(.22,.9,.3,1);max-width:640px;margin:0 auto;max-height:88vh;overflow-y:auto}
#sheet.on{transform:none}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 16px}
.sheet-title{font-family:var(--serif);font-size:21px;margin:0 0 14px}
.bigfield{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:15px 16px;font-size:17px;margin-bottom:14px}
.bigfield textarea{resize:none;font-size:17px;line-height:1.5;min-height:96px;display:block}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{background:var(--card-2);border:1px solid var(--line);border-radius:18px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:transform .14s ease,background .14s ease}
.choice:active{transform:scale(.96);background:var(--accent-soft)}
.choice .e{font-size:22px}
.choice .t{font-size:13.5px;font-weight:500;color:var(--ink-2)}
.frow{display:flex;gap:10px}
.frow>*{flex:1}

#toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + var(--safe-b) + 86px);transform:translate(-50%,10px);
  z-index:90;background:var(--ink);color:var(--canvas);padding:11px 18px;border-radius:999px;font-size:14.5px;
  opacity:0;pointer-events:none;transition:opacity .24s ease,transform .24s ease;box-shadow:var(--shadow-m);max-width:82vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
@media (min-width:700px){
  .view{padding-top:34px}
  .rooms{grid-template-columns:repeat(3,1fr)}
  /* el botón flotante acompaña a la columna de contenido, no al borde de la ventana */
  #fab{right:auto;left:50%;margin-left:244px}
}
</style>
</head>
<body>

<div id="dayline"><i></i></div>

<div id="app">
  <section id="v-home" class="view on"></section>
  <section id="v-lists" class="view"></section>
  <section id="v-detail" class="view"></section>
  <section id="v-notes" class="view"></section>
  <section id="v-shop" class="view"></section>
  <section id="v-settings" class="view"></section>
</div>

<button id="fab" aria-label="Añadir rápido">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav id="tabbar"><div class="inner">
  <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg><span>Hoy</span></button>
  <button class="tab" data-tab="lists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Listas</span></button>
  <button class="tab" data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/><path d="M8.5 13h7M8.5 16.5h4.5"/></svg><span>Notas</span></button>
  <button class="tab" data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.2 12.2H6.2z"/><path d="M9 9V6.5a3 3 0 0 1 6 0V9"/></svg><span>Compras</span></button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/></svg><span>Ajustes</span></button>
</div></nav>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
/* ============================================================
   SPA · SEGUNDA MEMORIA
   Aplicación de un solo archivo. Sin frameworks.
   Guarda todo automáticamente en el navegador (LocalStorage).
   ============================================================ */
(function(){

/* ---------- 1. Almacenamiento seguro -------------------------
   Usa LocalStorage. Si el navegador lo bloquea (modo privado o
   vista previa), cae a memoria para que la app nunca se rompa. */
const Store = (function(){
  let ok = true;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
  catch(e){ ok = false; }
  const mem = {};
  return {
    get(k){ try{ return ok ? localStorage.getItem(k) : (mem[k] ?? null); }catch(e){ return mem[k] ?? null; } },
    set(k,v){ try{ ok ? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; } },
    persistent: ok
  };
})();

const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dayKey = d => { d = d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const hhmm   = d => String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');

function whenLabel(ts){
  const d = new Date(ts), now = new Date();
  const same = dayKey(d) === dayKey(now);
  const yest = dayKey(d) === dayKey(new Date(now.getTime()-864e5));
  if(same) return 'Hoy · ' + hhmm(d);
  if(yest) return 'Ayer · ' + hhmm(d);
  return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)+' · '+hhmm(d);
}
function haptic(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms||8); }catch(e){} }

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('on'), 1900);
}

/* Reinicio diario: al abrir en un día nuevo, todo vuelve a empezar.
   Las notas y la lista de compras nunca se borran. */
function newDayCheck(){
  const today = dayKey();
  if(S.day === today) return false;
  S.day = today;
  allOwners().forEach(o => o.tasks.forEach(t => { t.done=false; t.skip=false; }));

const cat  = id => S.categories.find(c => c.id === id);
const room = id => S.rooms.find(r => r.id === id);
const allOwners = () => S.categories.concat(S.rooms);
const ownerOf = (type,id) => type === 'room' ? room(id) : cat(id);

/* Orden en el que la app va guiando el día */
const QUEUE_ORDER = ['apertura','pendientes','__rooms__','banos','limpieza','mara'];

function buildQueue(){
  const out = [];
  const add = (owner, type) => {
    if(!owner) return;
    owner.tasks.forEach(t => { if(!t.done) out.push({ ownerType:type, ownerId:owner.id, owner, task:t }); });
  };
  QUEUE_ORDER.forEach(step => {
    if(step === '__rooms__') S.rooms.forEach(r => add(r,'room'));
    else add(cat(step),'cat');
  });
  S.categories.forEach(c => { if(QUEUE_ORDER.indexOf(c.id) < 0) add(c,'cat'); });
  /* lo saltado se va al final, sin perderse */
  return out.filter(x => !x.task.skip).concat(out.filter(x => x.task.skip));
}
function counts(owner){
  const total = owner.tasks.length;
  const done  = owner.tasks.filter(t => t.done).length;
  return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}
function dayProgress(){
  let total=0, done=0;
  allOwners().forEach(o => { total += o.tasks.length; done += o.tasks.filter(t=>t.done).length; });
  return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}

/* ---------- 5. Color de acento ------------------------------ */
const isDark = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
function mix(hex, withWhite, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const t = withWhite ? 255 : 0;
  r=Math.round(r+(t-r)*amt); g=Math.round(g+(t-g)*amt); b=Math.round(b+(t-b)*amt);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function applyAccent(){
  const base = S.accent || '#9C7A3C';
  const c = isDark() ? mix(base,true,.42) : base;
  document.documentElement.style.setProperty('--accent', c);
  document.documentElement.style.setProperty('--accent-soft', hexA(c,.12));
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

/* Recordatorios: solo cosas del spa, derivadas de lo que falta */
function nudges(){
  const h = new Date().getHours(), out = [];
  const pend = o => o.tasks.filter(t=>!t.done).length;
  const ap = cat('apertura'), ma = cat('mara'), ba = cat('banos');
  if(ap && h >= 11 && pend(ap)) out.push({ level:'alert', text: counts(ap).done === 0
    ? 'La apertura sigue sin empezar · ' + pend(ap) + ' tareas'
    : 'La apertura quedó a medias · faltan ' + pend(ap) });
  if(ma && h >= 13 && pend(ma)) out.push({ level:'wait',  text:'Recuerda alimentar a Mara' });
  const roomPend = S.rooms.filter(r => counts(r).done < counts(r).total);
  if(h >= 10 && roomPend.length) out.push({ level:'wait', text:roomPend.length===1 ? 'Falta verificar ' + esc(roomPend[0].name) : 'Faltan ' + roomPend.length + ' habitaciones por verificar' });
  if(ba && h >= 15 && pend(ba)) out.push({ level:'wait', text:'No olvides revisar el baño' });
  return out.slice(0,2);
}

/* ---------- 10. Reordenar arrastrando ----------------------- */
function makeSortable(container, owner){
  let drag = null;
  container.addEventListener('pointerdown', e => {
    const handle = e.target.closest('[data-handle]'); if(!handle) return;
    const row = handle.closest('.item'); if(!row) return;
    e.preventDefault();
    const rows = $$('.item', container);
    const rects = rows.map(r => r.getBoundingClientRect());
    const idx = rows.indexOf(row);
    drag = { row, rows, rects, from: idx, to: idx, y0: e.clientY, h: rects[idx].height };
    row.classList.add('dragging');
    row.setPointerCapture(e.pointerId);
    haptic(6);
  });
  container.addEventListener('pointermove', e => {
    if(!drag) return;
    const dy = e.clientY - drag.y0;
    drag.row.style.transform = 'translateY(' + dy + 'px)';
    const center = drag.rects[drag.from].top + drag.rects[drag.from].height/2 + dy;
    let to = drag.from;
    drag.rects.forEach((r,i) => { if(i !== drag.from && center > r.top && center < r.bottom) to = i; });
    if(to !== drag.to){
      drag.to = to; haptic(4);
      drag.rows.forEach((r,i) => {
        if(r === drag.row) return;
        let shift = 0;
        if(drag.from < to && i > drag.from && i <= to) shift = -drag.h;
        if(drag.from > to && i < drag.from && i >= to) shift =  drag.h;
        r.style.transition = 'transform .18s cubic-bezier(.22,.9,.3,1)';
        r.style.transform = 'translateY(' + shift + 'px)';
      });
    }
  });
  const end = () => {
    if(!drag) return;
    const { from, to } = drag;
    drag.rows.forEach(r => { r.style.transition=''; r.style.transform=''; });
    drag.row.classList.remove('dragging');
    drag = null;
    if(from !== to){
      const moved = owner.tasks.splice(from,1)[0];
      owner.tasks.splice(to,0,moved);
      save();
    }
    renderDetail();
  };
  container.addEventListener('pointerup', end);
  container.addEventListener('pointercancel', end);
}

    '<div class="search">' + IC.search + '<input id="qNote" placeholder="Buscar en tus notas" value="' + esc(searchNote) + '"></div>' +
    (list.length
      ? '<div class="stack">' + list.map(n =>
          '<button class="note" data-act="open-note" data-id="' + n.id + '">' +
            '<div class="txt">' + esc(n.text) + '</div><div class="when">' + whenLabel(n.ts) + '</div></button>').join('') + '</div>'
      : '<div class="empty">' + (q ? 'Ninguna nota coincide.' : 'Aquí van las cosas que no quieres olvidar.<br>Usa el botón + para escribir la primera.') + '</div>');
  const qn = $('#qNote');
  qn.addEventListener('input', () => { searchNote = qn.value; const p = qn.selectionStart; renderNotes(); const f=$('#qNote'); f.focus(); f.setSelectionRange(p,p); });
}

function openNote(id){
  const n = S.notes.find(x => x.id === id); if(!n) return;
  openSheet(
    '<h3 class="sheet-title">Nota</h3>' +
    '<div class="bigfield"><textarea id="nText">' + esc(n.text) + '</textarea></div>' +
    '<div class="frow"><button class="btn-big" style="margin-top:0" data-sheet="save-note">Guardar</button></div>' +
    '<button class="btn-ghost danger" data-sheet="del-note">Eliminar nota</button>',
    {
      'save-note': () => { const v = $('#nText').value.trim(); if(v){ n.text=v; n.ts=Date.now(); save(); } closeSheet(); renderNotes(); toast('Nota guardada'); },
      'del-note' : () => { S.notes = S.notes.filter(x => x.id !== id); save(); closeSheet(); renderNotes(); toast('Nota eliminada'); }
    }
  );
}

/* ---------- 12. COMPRAS ------------------------------------- */
function renderShop(){
  const q = searchBuy.toLowerCase();
  const all = S.shopping.filter(i => !q || (i.name + ' ' + (i.place||'')).toLowerCase().includes(q));
  const favs = all.filter(i => i.fav), rest = all.filter(i => !i.fav);
  const row = i =>
    '<div class="buy">' +
      '<button class="star ' + (i.fav?'on':'') + '" data-act="fav" data-id="' + i.id + '" aria-label="Favorito">' + (i.fav?IC.starOn:IC.star) + '</button>' +
      '<button class="body" data-act="open-buy" data-id="' + i.id + '" style="text-align:left">' +
        '<div class="name">' + esc(i.name) + '</div>' +
        (i.place || i.note ? '<div class="meta">' + esc([i.place, i.note].filter(Boolean).join(' · ')) + '</div>' : '') +
      '</button>' +
      (i.price ? '<span class="price">S/' + esc(i.price) + '</span>' : '') +
    '</div>';
  $('#v-shop').innerHTML =
    '<header class="head"><div><h1>Compras</h1><div class="sub">Lo que sueles reponer</div></div></header>' +
    '<div class="search">' + IC.search + '<input id="qBuy" placeholder="Buscar producto o lugar" value="' + esc(searchBuy) + '"></div>' +
    (all.length
      ? (favs.length ? '<div class="section-label eyebrow" style="margin-top:6px">Favoritos</div><div class="stack">' + favs.map(row).join('') + '</div>' : '') +
        (rest.length ? (favs.length ? '<div class="section-label eyebrow">Todo</div>' : '') + '<div class="stack">' + rest.map(row).join('') + '</div>' : '')
      : '<div class="empty">' + (q ? 'Ningún producto coincide.' : 'Guarda aquí lo que compras siempre:<br>nombre, precio y dónde lo consigues.') + '</div>');
  const qb = $('#qBuy');
  qb.addEventListener('input', () => { searchBuy = qb.value; const p = qb.selectionStart; renderShop(); const f=$('#qBuy'); f.focus(); f.setSelectionRange(p,p); });
}

function openBuy(id){
  const i = S.shopping.find(x => x.id === id); if(!i) return;
  openSheet(
    '<h3 class="sheet-title">Producto</h3>' +
    '<div class="bigfield"><input id="bName" value="' + esc(i.name) + '" placeholder="Nombre"></div>' +
    '<div class="frow"><div class="bigfield"><input id="bPrice" value="' + esc(i.price||'') + '" placeholder="Precio aprox." inputmode="decimal"></div>' +
    '<div class="bigfield"><input id="bPlace" value="' + esc(i.place||'') + '" placeholder="Dónde"></div></div>' +
    '<div class="bigfield"><input id="bNote" value="' + esc(i.note||'') + '" placeholder="Nota (opcional)"></div>' +
    '<button class="btn-big" style="margin-top:0" data-sheet="save-buy">Guardar</button>' +
    '<button class="btn-ghost danger" data-sheet="del-buy">Eliminar producto</button>',
    {
      'save-buy': () => {
        const v = $('#bName').value.trim(); if(!v){ closeSheet(); return; }
        i.name=v; i.price=$('#bPrice').value.trim(); i.place=$('#bPlace').value.trim(); i.note=$('#bNote').value.trim();
        save(); closeSheet(); renderShop(); toast('Producto guardado');
      },
      'del-buy': () => { S.shopping = S.shopping.filter(x=>x.id!==id); save(); closeSheet(); renderShop(); toast('Producto eliminado'); }
    }
  );
}

/* ---------- 13. AJUSTES ------------------------------------- */
function renderSettings(){
  $('#v-settings').innerHTML =
    '<header class="head"><div><h1>Ajustes</h1><div class="sub">Todo se guarda solo</div></div></header>' +

    '<div class="section-label eyebrow">Tu spa</div>' +
    '<div class="list">' +
      '<div class="field"><span class="k">Nombre del spa</span><input id="setSpa" value="' + esc(S.spaName) + '" placeholder="Mi spa"></div>' +
      '<div class="field"><span class="k">Tu nombre</span><input id="setUser" value="' + esc(S.userName) + '" placeholder="Para el saludo"></div>' +
    '</div>' +

    '<div class="section-label eyebrow">Color principal</div>' +
    '<div class="list"><div class="swatches">' +
      PALETTE.map(p => '<button class="sw ' + (S.accent===p[0]?'on':'') + '" data-act="accent" data-hex="' + p[0] + '" style="background:' + p[0] + '" aria-label="' + p[1] + '"></button>').join('') +
    '</div></div>' +

    '<div class="section-label eyebrow">Icono</div>' +
    '<div class="list"><div class="iconrow">' +
      '<img src="' + (S.icon || DEFAULT_ICON) + '" alt="Icono">' +
      '<div style="flex:1"><div style="font-size:15px">Icono de la app</div><div style="font-size:13px;color:var(--ink-3)">Se usa al añadirla a la pantalla de inicio</div></div>' +
      '<button class="txtbtn" data-act="pick-icon">Cambiar</button>' +
    '</div></div>' +

    '<div class="section-label eyebrow">Tus datos</div>' +
    '<div class="list">' +
      '<button class="field" data-act="backup" style="width:100%"><span class="k" style="flex:1;text-align:left;color:var(--ink)">Guardar copia de seguridad</span><span class="txtbtn">Descargar</span></button>' +
      '<button class="field" data-act="restore" style="width:100%"><span class="k" style="flex:1;text-align:left;color:var(--ink)">Restaurar copia</span><span class="txtbtn">Abrir archivo</span></button>' +
    '</div>' +
    '<button class="btn-ghost danger" data-act="reset">Restablecer todo</button>' +
    '<p class="fineprint">' + (Store.persistent
      ? 'Tus datos viven solo en este dispositivo y no salen de él.<br>Las tareas se reinician cada mañana; notas y compras se quedan.'
      : 'Este navegador no está guardando datos de forma permanente. Descarga una copia de seguridad para no perder nada.') + '</p>';

  const sp = $('#setSpa'), us = $('#setUser');
  sp.addEventListener('change', () => { S.spaName = sp.value.trim(); save(); });
  us.addEventListener('change', () => { S.userName = us.value.trim(); save(); toast('Listo'); });
}

function pickIcon(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => { S.icon = rd.result; save(); applyIcon(); renderSettings(); toast('Icono actualizado'); };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function applyIcon(){
  const src = S.icon || DEFAULT_ICON;
  $('#favicon').href = src; $('#touchicon').href = src;
}
function backup(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'spa-memoria-' + dayKey() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Copia descargada');
}
function restore(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if(!d.categories) throw new Error('bad');
        S = Object.assign(defaults(), d); save(); applyAccent(); applyIcon();
        go('home'); toast('Copia restaurada');
      }catch(e){ toast('Ese archivo no es una copia válida'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function confirmReset(){
  openSheet(
    '<h3 class="sheet-title">¿Restablecer todo?</h3>' +
    '<p style="color:var(--ink-2);font-size:15px;margin:0 0 18px">Se borran tus listas, notas y compras, y todo vuelve como al principio. No se puede deshacer.</p>' +
    '<button class="btn-big" style="margin-top:0;background:var(--alert);box-shadow:none;color:#fff" data-sheet="do-reset">Sí, restablecer</button>' +
    '<button class="btn-ghost" data-sheet="cancel">Cancelar</button>',
    {
      'do-reset': () => { S = defaults(); save(); applyAccent(); applyIcon(); closeSheet(); go('home'); toast('Todo restablecido'); },
      'cancel'  : closeSheet
    }
  );
}

/* ---------- 14. Hoja inferior (sheet) ----------------------- */
let sheetActions = {};
function openSheet(html, actions){
  sheetActions = actions || {};
  $('#sheet').innerHTML = '<div class="grabber"></div>' + html;
  $('#scrim').classList.add('on');
  requestAnimationFrame(()=> $('#sheet').classList.add('on'));
}
function closeSheet(){
  $('#sheet').classList.remove('on');
  $('#scrim').classList.remove('on');
  sheetActions = {};
  setTimeout(()=>{ if(!$('#sheet').classList.contains('on')) $('#sheet').innerHTML=''; }, 340);
}

/* ---------- 15. Añadir rápido ------------------------------- */
function quickAdd(){
  openSheet(
    '<h3 class="sheet-title">Añadir rápido</h3>' +
    '<div class="bigfield"><textarea id="qaText" placeholder="Escribe y elige dónde va…" style="min-height:76px"></textarea></div>' +
    '<div class="choices">' +
      '<button class="choice" data-sheet="qa-note"><span class="e">📝</span><span class="t">Nota</span></button>' +
      '<button class="choice" data-sheet="qa-task"><span class="e">✅</span><span class="t">Tarea</span></button>' +
      '<button class="choice" data-sheet="qa-buy"><span class="e">🛒</span><span class="t">Compra</span></button>' +
    '</div>',
    {
      'qa-note': () => finishQuick('note'),
      'qa-task': () => finishQuick('task'),
      'qa-buy' : () => finishQuick('buy')
    }
  );
  setTimeout(()=>{ const f = $('#qaText'); if(f) f.focus(); }, 320);
}
function finishQuick(kind){
  const v = ($('#qaText').value || '').trim();
  if(!v){ closeSheet(); return; }
  if(kind === 'note'){
    S.notes.unshift({ id:uid(), text:v, ts:Date.now() });
    save(); closeSheet(); toast('Guardado en Notas'); if(view==='notes') renderNotes();
  }
  if(kind === 'task'){
    cat('pendientes').tasks.push({ id:uid(), text:v, done:false, skip:false });
    save(); closeSheet(); toast('Añadido a Pendientes'); render();
  }
  if(kind === 'buy'){
    S.shopping.unshift({ id:uid(), name:v, price:'', place:'', note:'', fav:false });
    save(); closeSheet(); toast('Añadido a Compras'); if(view==='shop') renderShop();
  }
  haptic(8);
}

/* ---------- 16. Eventos globales ---------------------------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if(tab){ go(tab.dataset.tab); return; }

  const sheetBtn = e.target.closest('[data-sheet]');
  if(sheetBtn){ const fn = sheetActions[sheetBtn.dataset.sheet]; if(fn) fn(); return; }

  const el = e.target.closest('[data-act]'); if(!el) return;
  const id = el.dataset.id;
  switch(el.dataset.act){
    case 'done':      completeCurrent(); break;
    case 'skip':      skipCurrent(); break;
    case 'open-cat':  detail = {type:'cat', id};  go('detail'); break;
    case 'open-room': detail = {type:'room', id}; go('detail'); break;
    case 'back-lists':go('lists'); break;
    case 'edit-mode': editMode = !editMode; renderDetail(); break;
    case 'toggle':    toggleTask(id); break;
    case 'del-item': {
      const o = ownerOf(detail.type, detail.id);
      o.tasks = o.tasks.filter(t => t.id !== id); save(); renderDetail(); break;
    }
    case 'room-ready': {
      const r = room(detail.id); const all = r.tasks.every(t => t.done);
      r.tasks.forEach(t => { t.done = !all; t.skip = false; });
      save(); haptic(12); renderDetail();
      if(!all) toast(r.name + ' lista');
      break;
    }
    case 'add-room': {
      const r = { id:uid(), name:'Habitación ' + (S.rooms.length+1), tasks:mkTasks(ROOM_LIST) };
      S.rooms.push(r); save(); detail = {type:'room', id:r.id}; editMode = true; go('detail');
      break;
    }
    case 'del-room': {
      const r = room(detail.id);
      openSheet('<h3 class="sheet-title">¿Eliminar ' + esc(r.name) + '?</h3>' +
        '<p style="color:var(--ink-2);font-size:15px;margin:0 0 18px">Se borra su checklist. No se puede deshacer.</p>' +
        '<button class="btn-big" style="margin-top:0;background:var(--alert);box-shadow:none;color:#fff" data-sheet="yes">Eliminar</button>' +
        '<button class="btn-ghost" data-sheet="no">Cancelar</button>',
        { yes: () => { S.rooms = S.rooms.filter(x => x.id !== r.id); save(); closeSheet(); go('lists'); }, no: closeSheet });
      break;
    }
    case 'open-note': openNote(id); break;
    case 'open-buy':  openBuy(id); break;
    case 'fav': {
      const i = S.shopping.find(x => x.id === id); i.fav = !i.fav; save(); haptic(6); renderShop(); break;
    }
    case 'accent':    S.accent = el.dataset.hex; save(); applyAccent(); renderSettings(); break;
    case 'pick-icon': pickIcon(); break;
    case 'backup':    backup(); break;
    case 'restore':   restore(); break;
    case 'reset':     confirmReset(); break;
  }
});

$('#fab').addEventListener('click', quickAdd);
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

/* Reloj y control de día nuevo */
setInterval(() => {
  const c = $('#clock'); if(c) c.textContent = hhmm(new Date());
  if(newDayCheck() && view === 'home') renderHome();
}, 20000);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden){ if(newDayCheck()) toast('Buen día nuevo · listas reiniciadas'); render(); }
});
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change', applyAccent);
}

/* ---------- 17. Arranque ------------------------------------ */
newDayCheck();
applyAccent();
applyIcon();
go('home');

})();

</script>
