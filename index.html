<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{

}

.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--ink-soft);letter-spacing:0}
.top-sp{flex:1}
main{flex:1;padding:12px 12px calc(84px + var(--safe-b)) 12px;max-width:1200px;width:100%;margin:0 auto}
nav#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:var(--safe-b);
}
nav#tabs button{
  background:none;border:0;padding:7px 2px 8px;cursor:pointer;

  font-size:10px;color:var(--ink-soft);
}

  .col-right{flex:1;min-width:0;display:flex;flex-direction:column}
  main{padding:16px 20px 40px}

const METODOS = ["Efectivo","Yape","Plin","Visa","Transferencia","Otro","No registrado"];
const DURACIONES = [15,30,45,60];

const TURNOS = ["Mañana","Tarde","Ambos"];

/* ---------------- Utilidades de texto / hora (Options.cs) ---------------- */
function normalizeText(t){
  if(t===null||t===undefined) return '';
  const s=String(t).trim(); if(!s) return '';
  return s.normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC')
          .toUpperCase().replace(/\s+/g,' ').trim();
}
function titleName(t){
  if(!t) return '';
  return String(t).trim().toLowerCase().replace(/(^|\s|\/)([\p{L}])/gu,(m,a,b)=>a+b.toUpperCase());
}
function hora12(v){
  if(v===null||v===undefined||v==='') return '';
  let mins;
  if(typeof v==='number') mins=v;
  else{
    const m=/^(\d{1,2}):(\d{2})/.exec(String(v).trim());
    if(!m) return String(v);
    mins=(+m[1])*60+(+m[2]);
  }
  let h=Math.floor(mins/60)%24; if(h<0)h+=24;
  const mi=((mins%60)+60)%60;
  const suf=h<12?'AM':'PM'; let h12=h%12; if(h12===0)h12=12;
  return h12+':'+String(mi).padStart(2,'0')+' '+suf;
}
/* Lectura tolerante: "5", "5 pm", "930", "17:00". Sin AM/PM: 1..8 sin cero
   adelante se asumen de la tarde (el spa abre 9 AM). Igual que TryParseHora. */
function parseHora(txt){
  if(!txt) return null;
  let s=String(txt).toUpperCase().replace(/[\s ]+/g,'');
  s=s.replace(/A\.M\.?/g,'AM').replace(/P\.M\.?/g,'PM');
  let pm=false,am=false;
  if(s.endsWith('PM')){pm=true;s=s.slice(0,-2);}
  else if(s.endsWith('AM')){am=true;s=s.slice(0,-2);}
  else if(s.endsWith('P')&&s.length>1){pm=true;s=s.slice(0,-1);}
  else if(s.endsWith('A')&&s.length>1){am=true;s=s.slice(0,-1);}
  s=s.replace(/\./g,':');
  if(!s.length) return null;
  let h,m=0,horaParte=s;
  if(s.includes(':')){
    const p=s.split(':').filter(x=>x!=='');
    if(p.length<1||p.length>3) return null;
    horaParte=p[0]; h=parseInt(p[0],10); if(isNaN(h)) return null;
    if(p.length>=2){ m=parseInt(p[1],10); if(isNaN(m)) return null; }
  }else if(s.length>=3&&/^\d+$/.test(s)){
    const hm=parseInt(s,10); h=Math.floor(hm/100); m=hm%100; horaParte=s.slice(0,-2);
  }else{ h=parseInt(s,10); if(isNaN(h)) return null; }
  if(m<0||m>59) return null;
  if(am||pm){ if(h<1||h>12) return null; if(h===12)h=0; if(pm)h+=12; }
  else{
    if(h<0||h>23) return null;
    const ceroAdelante=horaParte.length>=2&&horaParte[0]==='0';
    if(!ceroAdelante&&h>=1&&h<=8) h+=12;
  }
  return h*60+m;
}
function horaGuardar(txt){
  const m=parseHora(txt);
  if(m===null) return (txt||'').trim();
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
}
function horaMin(hhmm){ const m=/^(\d{1,2}):(\d{2})/.exec(String(hhmm||'')); return m?(+m[1])*60+(+m[2]):null; }

function normalizePaymentMethod(t){
  const x=normalizeText(t);
  if(!x) return 'No registrado';
  if(x.includes('MIXTO')) return 'Mixto';
  if(x.includes('YAPE')) return 'Yape';
  if(x.includes('PLIN')) return 'Plin';
  if(x.includes('VISA')||x.includes('TARJETA')||x.includes('POS')||x.includes('CREDITO')||x.includes('DEBITO')) return 'Visa';
  if(x.includes('EFECTIVO')||x.includes('CASH')) return 'Efectivo';
  if(x.includes('TRANSFER')||x.includes('DEPOSITO')||x.includes('BCP')||x.includes('INTERBANK')||x.includes('BBVA')) return 'Transferencia';
  return METODOS.includes(t)?t:'Otro';
}
/* PagosDetalle: "Efectivo=60.00|Yape=40.00" (siempre punto decimal). */
function pagosSerializar(list){
  return list.filter(p=>p.metodo&&p.monto>0)
             .map(p=>p.metodo.trim()+'='+Number(p.monto).toFixed(2)).join('|');
}
function pagosParsear(det){
  if(!det) return [];
  return String(det).split('|').filter(Boolean).map(part=>{
    const i=part.indexOf('='); if(i<=0) return null;
    const metodo=part.slice(0,i).trim(); const monto=parseFloat(part.slice(i+1));
    return (metodo&&monto>0)?{metodo,monto}:null;
  }).filter(Boolean);
}
function pagosTexto(det){ return pagosParsear(det).map(p=>p.metodo+' S/ '+money(p.monto)).join(' + '); }
function pagosDeAtencion(metodo,total,detalle){
  const d=pagosParsear(detalle);
  return d.length? d : [{metodo:normalizePaymentMethod(metodo),monto:Number(total)||0}];
}
/* Paquetes: "Nombre=Precio@Min@1|..." */
function parsePaquete(det){
  if(!det) return [];
  return String(det).split('|').filter(Boolean).map(part=>{
    const kv=part.split('='); if(kv.length!==2||!kv[0].trim()) return null;
    const d=kv[1].split('@'); const precio=parseFloat(d[0]); if(isNaN(precio)) return null;
    return {nombre:kv[0].trim(),precio,minutos:d.length>1?(parseInt(d[1],10)||0):0,
            ocupa:d.length<=2||d[2]!=='0'};
  }).filter(Boolean);
}
function buildPaquete(comps){
  return comps.filter(c=>c.nombre&&c.precio>0)
    .map(c=>`${c.nombre.replace(/\|/g,'-').replace(/=/g,' ').trim()}=${c.precio}@${c.minutos||0}@${c.ocupa?1:0}`)
    .join('|');
}
function paqueteResumen(det){ return parsePaquete(det).map(c=>`${c.nombre} S/${fmt(c.precio)} (${c.minutos}')`).join(' + '); }

/* ---------------- Fechas ---------------- */
function hoyISO(){ const d=new Date(); return isoOf(d); }
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dFromISO(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function fechaCorta(iso){ const d=dFromISO(iso); return d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():(iso||''); }
function addDaysISO(iso,n){ const d=dFromISO(iso)||new Date(); d.setDate(d.getDate()+n); return isoOf(d); }
function diasEntre(isoA,isoB){ const a=dFromISO(isoA),b=dFromISO(isoB); if(!a||!b) return null; return Math.round((b-a)/86400000); }
function fechaLarga(iso){
  const d=dFromISO(iso); if(!d) return iso||'';
  const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const mes=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${dias[d.getDay()]} ${d.getDate()} ${mes[d.getMonth()]}`;
}
function money(n){ return (Number(n)||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmt(n){ const v=Number(n)||0; return v%1===0?String(v):v.toFixed(2).replace(/0$/,''); }

/* ---------------- Reglas de negocio ---------------- */
function duracionesBasicas(spa){ return normalizeText(spa)==='ULIANOV'?DURACIONES_ULIANOV:DURACIONES; }
/* Monto del descuento fijo: lo define el spa del SERVICIO (Ulianov 15, Adhamar 10). */
function descuentoPorSpa(spaServicio){ return normalizeText(spaServicio)==='ULIANOV'?15:10; }

function baseVigencia(ultimaVisita,desde){
  if(ultimaVisita&&desde) return ultimaVisita>desde?ultimaVisita:desde;
  return ultimaVisita||desde||null;
}
function vipVigente(c,fechaISO){
  if(!num(c,'EsVip')) return false;
  const b=baseVigencia(str(c,'UltimaVisita'),str(c,'VipDesde'));
  if(!b) return false;
  const d=diasEntre(b.slice(0,10),fechaISO);
  return d!==null&&d<=60;
}
function antiguoVigente(c,fechaISO){
  if(!num(c,'EsAntiguo')) return false;
  const b=baseVigencia(str(c,'UltimaVisita'),str(c,'AntiguoDesde'));
  if(!b) return false;
  const bd=dFromISO(b.slice(0,10)); const fd=dFromISO(fechaISO);
  if(!bd||!fd) return false;
  const lim=new Date(bd.getFullYear(),bd.getMonth()+3,bd.getDate());
  return lim>=fd;
}
function tieneDescuentoFijo(c,fechaISO){ return vipVigente(c,fechaISO)||antiguoVigente(c,fechaISO); }

/* ---------------- Acceso tipado al payload ---------------- */
function str(p,k){ const v=p?p[k]:null; return (v===null||v===undefined)?'':String(v); }
function num(p,k){ const v=p?p[k]:null; if(v===null||v===undefined||v==='') return 0; const n=Number(v); return isNaN(n)?0:n; }
function bool(p,k){ return num(p,k)===1||p?.[k]===true; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let CFG = null;
function loadCfg(){

  return CFG;

async function sha256(txt){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* =====================================================================
   CANDADO DEL PIN
   El acceso guardado se cifra con el PIN. Sin el PIN correcto no hay
   forma de reconstruirlo: no queda nada utilizable en el teléfono.
   ===================================================================== */
const hex = b => [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex = h => new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16)));
async function claveDePin(pin, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sellar(pin, texto){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await claveDePin(pin,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv}, k, new TextEncoder().encode(texto));
  return {s:hex(salt), i:hex(iv), c:hex(ct)};
}
async function abrirSello(pin, blob){
  try{
    const k=await claveDePin(pin, unhex(blob.s));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:unhex(blob.i)}, k, unhex(blob.c));
    return new TextDecoder().decode(pt);
  }catch{ return null; }   // PIN incorrecto o dato manipulado
}

/* =====================================================================
   SESIÓN: cuenta propia de cada persona (Supabase Auth)
   ===================================================================== */
/* Ninguna petición puede quedarse colgada para siempre: a los 20 segundos
   se corta y se avisa. Sin esto, la pantalla se quedaba en "Comprobando…". */
async function fetchLimitado(url, opts, ms){
  const ctrl = new AbortController();
  const reloj = setTimeout(()=>ctrl.abort(), ms||20000);
  try{
    return await fetch(url, Object.assign({}, opts||{}, {signal:ctrl.signal}));
  }catch(e){
    if(e.name==='AbortError')
      throw new Error('La nube no respondió en 20 segundos. Revisa que el equipo tenga internet y que la URL esté bien escrita.');
    throw new Error('No se pudo conectar con la nube. Revisa el internet y la URL. ('+e.message+')');
  }finally{ clearTimeout(reloj); }
}

const AUTH = {
  sesion: null,
  base(){ return CFG.url.replace(/\/+$/,'') + '/auth/v1/'; },
  async post(ruta, body){
    const r = await fetchLimitado(this.base()+ruta, {method:'POST',
      headers:{'apikey':CFG.key,'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json().catch(()=>({}));
    if(!r.ok){
      const m = j.error_description || j.msg || j.message || ('HTTP '+r.status);
      throw new Error(/invalid.*credential|invalid.*grant/i.test(m) ? 'Usuario o contraseña incorrectos' : m);
    }
    return j;
  },
  guardar(j){
    this.sesion = {
      access_token:j.access_token, refresh_token:j.refresh_token,
      expira: Date.now() + ((j.expires_in||3600)*1000) - 60000,
      email:(j.user&&j.user.email)||'', uid:(j.user&&j.user.id)||'',
      nombre:'', rol:'personal', activo:false
    };
    return this.sesion;
  },
  async entrar(email, pass){ return this.guardar(await this.post('token?grant_type=password',{email,password:pass})); },
  async renovar(rt){ return this.guardar(await this.post('token?grant_type=refresh_token',{refresh_token:rt})); },
  async token(){
    if(!this.sesion) throw new Error('SIN_SESION');
    if(Date.now() > this.sesion.expira) await this.renovar(this.sesion.refresh_token);
    return this.sesion.access_token;
  },
  /* Nombre, rol y si sigue habilitada. Si la administradora la dio de baja,
     esta consulta ya no devuelve nada y la app no deja pasar. */
  async ficha(){
    const f = await API.tabla('adhuliav_web_usuarios',
      'select=nombre,rol,activo&user_id=eq.'+encodeURIComponent(this.sesion.uid));
    if(f.length){ this.sesion.nombre=f[0].nombre||''; this.sesion.rol=f[0].rol||'personal'; this.sesion.activo=!!f[0].activo; }
    else { this.sesion.rol='personal'; this.sesion.activo=false; }
    return this.sesion;
  },
  esAdmin(){ return !!this.sesion && this.sesion.rol==='admin' && this.sesion.activo; },
  salir(){ this.sesion=null; localStorage.removeItem(LS.sess); }
};

/* =====================================================================
   API SUPABASE (PostgREST)  —  sin librerías externas
   Cada petición lleva la sesión de la persona Y el identificador de este
   equipo. La nube exige las dos cosas (ver SUPABASE_1_SEGURIDAD.sql).
   ===================================================================== */
const API = {
  base(){ return CFG.url.replace(/\/+$/,'') + '/rest/v1/'; },
  async headers(extra){
    return Object.assign({
      'apikey': CFG.key,
      'Authorization': 'Bearer ' + (await AUTH.token()),
      'x-device-id': CFG.deviceId || '',
      'Content-Type': 'application/json'
    }, extra||{});
  },
  async pedir(url, opts){
    const r = await fetchLimitado(url, opts);
    if(!r.ok){
      const txt=(await r.text()).slice(0,180);
      if(r.status===401||r.status===403) throw new Error('SESION_VENCIDA');
      throw new Error('HTTP '+r.status+' '+txt);
    }
    return r;
  },
  async tabla(nombre, query){
    const r=await this.pedir(this.base()+nombre+'?'+query, {headers:await this.headers()});
    return r.json();
  },
  async insertar(nombre, filas){
    await this.pedir(this.base()+nombre, {method:'POST',
      headers:await this.headers({'Prefer':'return=minimal'}), body:JSON.stringify(filas)});
    return true;
  },
  async actualizar(nombre, query, cambios){
    await this.pedir(this.base()+nombre+'?'+query, {method:'PATCH',
      headers:await this.headers({'Prefer':'return=minimal'}), body:JSON.stringify(cambios)});
    return true;
  },
  get(query){ return this.tabla('adhuliav_sync_records', query); },
  async upsert(rows){
    if(SOLO_LECTURA) throw new Error('La página está en modo solo lectura');
    await this.pedir(this.base()+'adhuliav_sync_records?on_conflict=table_name,sync_key', {
      method:'POST', headers:await this.headers({'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify(rows)});
    return true;
  },
  /* Comprueba la URL y la clave anon sin necesidad de haber entrado. */
  async pingClaves(){
    const r = await fetchLimitado(CFG.url.replace(/\/+$/,'')+'/auth/v1/settings', {headers:{'apikey':CFG.key}});
    if(!r.ok) throw new Error(r.status===401
      ? 'La clave anon no es correcta (la nube la rechazó).'
      : 'La URL o la clave anon no son correctas (HTTP '+r.status+')');
    return true;
  },
  /* ¿Este equipo está registrado y activo? */
  async equipoActivo(){
    const d = await this.tabla('adhuliav_web_dispositivos',
      'select=nombre,activo&device_id=eq.'+encodeURIComponent(CFG.deviceId||'-'));
    return d.length ? !!d[0].activo : false;
  }
};

/* =====================================================================
   BASE LOCAL EN MEMORIA
   DB[tabla] = Map(sync_key -> payload)
   ===================================================================== */
const DB = {};
TABLES.forEach(t=>DB[t]=new Map());
let STATE = { lastPull:null, loaded:false };
/* Sube en cada cambio de datos: invalida cachés derivadas (disponibilidad). */
let DATA_VERSION = 0;
function tocarDatos(){ DATA_VERSION++; }

function rows(table, filterFn){
  const out=[];
  DB[table].forEach((p,k)=>{ if(!p.__deleted && (!filterFn||filterFn(p))) { p.__key=k; out.push(p); } });
  return out;
}
function rowByKey(table,key){ return DB[table].get(key)||null; }

/* ---------------- sync_key: puerto exacto de BuildStableSyncKey ---------------- */
function cleanPart(v){
  if(v===null||v===undefined||String(v).trim()==='') return '';
  return normalizeText(v).replace(/\|/g,'-');
}
function buildSyncKey(table,p,fallback){
  const V=k=>{ const v=p[k]; return (v===null||v===undefined)?'':String(v); };
  const K=(...parts)=> table+'|'+parts.map(x=>(!x||!String(x).trim())?'_':x).join('|');
  const spa=cleanPart(V('Spa')), norm=cleanPart(V('NombreNormalizado')),
        nombre=cleanPart(V('Nombre')), codigo=cleanPart(V('CodigoCliente'));
  switch(table){
    case 'Clientes': return K(spa, codigo||norm||cleanPart(V('ClienteNombre')));
    case 'Masajistas': return K(spa, norm||cleanPart(V('NombreAdhamar'))||nombre||cleanPart(V('NombreReal')));
    case 'ServiciosPrecios': return K(spa, cleanPart(V('ServicioNormalizado')), cleanPart(V('DuracionMin')));
    case 'Promociones': return K(spa, norm||nombre);
    case 'InventarioItems': return K(norm||nombre);
    case 'AsistenciasTerapeutas': return K(spa, cleanPart(V('Fecha')), cleanPart(V('MasajistaNombre')), cleanPart(V('Turno')));
    case 'HorariosTerapeutasMensuales': return K(spa, cleanPart(V('Anio')), cleanPart(V('Mes')), cleanPart(V('MasajistaNombre')));
    // Atenciones: clave CONGELADA (no se recalcula nunca con datos que cambian).
    case 'Atenciones': return fallback && fallback.trim() ? fallback : newGuid();
    case 'CajaMovimientos': return K(spa, cleanPart(V('Fecha')), cleanPart(V('Hora')), cleanPart(V('Tipo')), cleanPart(V('Concepto')), cleanPart(V('Monto')));
    case 'InventarioMovimientos': return K(spa, cleanPart(V('Fecha')), cleanPart(V('ItemNombre')), cleanPart(V('Tipo')), cleanPart(V('Cantidad')), cleanPart(V('Motivo')));
    default: return fallback && fallback.trim() ? fallback : newGuid();
  }
}
function newGuid(){
  const b=crypto.getRandomValues(new Uint8Array(16));
  return [...b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

/* =====================================================================
   SINCRONIZACIÓN
   ===================================================================== */
const SYNC = {
  status:'idle', err:'', pulling:false, pushing:false, timer:null,

  setStatus(s,err){
    this.status=s; this.err=err||'';
    const dot=document.getElementById('stDot'), txt=document.getElementById('stTxt');
    if(!dot) return;
    dot.className='dotst '+(s==='ok'?'ok':s==='error'?'bad':s==='busy'?'busy':'');
    const out=OUTBOX.count();
    txt.textContent = s==='error' ? 'sin conexión'
      : s==='busy' ? 'sincronizando…'
      : (out>0 ? out+' por subir' : 'al día');
    txt.title = this.err || '';
  },

  /* Descarga incremental. La primera vez baja catálogo completo + operación
     de los últimos N días (histórico configurable). */
  async pull(){
    if(this.pulling) return; this.pulling=true;
    this.setStatus('busy');
    try{
      let changed=false;
      if(!STATE.lastPull){
        const desde = addDaysISO(hoyISO(), -(CFG.dias||120));
        // El almacén no se usa en la web: no se descarga (menos datos en el celular).
        const catalogo=['Clientes','Masajistas','ServiciosPrecios','Promociones','HorariosTerapeutasMensuales'];
        const operacion=['Atenciones','AsistenciasTerapeutas','CajaMovimientos'];
        await this.page(`table_name=in.(${catalogo.join(',')})`);
        await this.page(`table_name=in.(${operacion.join(',')})&payload->>Fecha=gte.${desde}`);
        changed=true;
      }else{
        const n = await this.page(`updated_at=gte.${encodeURIComponent(STATE.lastPull)}`);
        changed = n>0;
      }
      // Margen de 2 minutos: los relojes de las laptops no están perfectamente
      // sincronizados y updated_at lo escribe cada terminal con su propia hora.
      STATE.lastPull = new Date(Date.now()-120000).toISOString();
      saveState(); if(changed) saveCache();
      this.setStatus('ok');
      if(changed) render();
    }catch(e){
      this.setStatus('error', e.message);
      if(e.message==='SESION_VENCIDA'||e.message==='SIN_SESION') sesionCaida();
    }finally{ this.pulling=false; }
  },

  async page(filter){
    const LIMIT=1000; let off=0, total=0;
    for(;;){
      const q=`select=table_name,sync_key,payload,updated_at,deleted&${filter}&order=updated_at.asc&limit=${LIMIT}&offset=${off}`;
      const data=await API.get(q);
      data.forEach(r=>{
        const p = (typeof r.payload==='string') ? JSON.parse(r.payload) : (r.payload||{});
        p.__key=r.sync_key; p.__updated=r.updated_at; p.__deleted=!!r.deleted;
        if(!DB[r.table_name]) return;
        if(r.deleted) DB[r.table_name].delete(r.sync_key);
        else DB[r.table_name].set(r.sync_key,p);
        tocarDatos();
      });
      total+=data.length;
      if(data.length<LIMIT) break;
      off+=LIMIT;
    }
    return total;
  },

  async push(){
    if(SOLO_LECTURA || this.pushing) return;
    const pend=OUTBOX.all(); if(!pend.length) return;
    this.pushing=true; this.setStatus('busy');
    try{
      // De a 40 por request para no armar cuerpos gigantes en el celular.
      for(let i=0;i<pend.length;i+=40){
        await API.upsert(pend.slice(i,i+40).map(x=>x.row));
      }
      OUTBOX.clear(pend.map(x=>x.id));
      this.setStatus('ok');
    }catch(e){
      this.setStatus('error', e.message);
    }finally{ this.pushing=false; }
  },

  async now(){ await this.push(); await this.pull(); },

  start(){
    clearInterval(this.timer);
    const cada=Math.max(4,(CFG.refresh||7))*1000;
    this.timer=setInterval(()=>{ if(document.visibilityState==='visible') this.now(); }, cada);
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') this.now(); });
    window.addEventListener('online',()=>this.now());
  }
};

/* ---------------- Bandeja de salida (soporta trabajar sin señal) ---------------- */
const OUTBOX = {
  all(){ try{ return JSON.parse(localStorage.getItem(LS.outbox)||'[]'); }catch{ return []; } },
  count(){ return this.all().length; },
  add(row){
    const list=this.all();
    // Una sola entrada viva por (tabla, clave): la última gana.
    const i=list.findIndex(x=>x.row.table_name===row.table_name&&x.row.sync_key===row.sync_key);
    const entry={id:newGuid(),row};
    if(i>=0) list[i]=entry; else list.push(entry);
    localStorage.setItem(LS.outbox,JSON.stringify(list));
  },
  clear(ids){
    const s=new Set(ids);
    localStorage.setItem(LS.outbox,JSON.stringify(this.all().filter(x=>!s.has(x.id))));
  }
};

/* ---------------- Guardar / borrar un registro ---------------- */
async function saveRow(table, data, existing){
  if(SOLO_LECTURA){ toast('Modo solo lectura: registra desde la laptop'); return null; }
  const now = new Date().toISOString();
  const payload = Object.assign({}, SCHEMA[table], existing||{}, data);
  delete payload.__key; delete payload.__updated; delete payload.__deleted;
  const fallback = (existing && existing.__key) || (existing && existing.SyncKey) || '';
  const key = buildSyncKey(table, payload, fallback);
  payload.SyncKey = key;
  payload.UpdatedAt = now;
  payload.SyncDeleted = 0;
  if(payload.Id===undefined) payload.Id = (existing&&existing.Id)||0;

  const json = JSON.stringify(payload);
  const row = {
    table_name: table, sync_key: key, payload: payload,
    payload_hash: await sha256(json), updated_at: now,
    device_id: 'WEB-' + (CFG.deviceName || 'movil'), deleted: false
  };
  // Se ve al instante en pantalla; la subida puede esperar a que haya señal.
  const local = Object.assign({}, payload, {__key:key, __updated:now, __deleted:false});
  DB[table].set(key, local); tocarDatos();
  OUTBOX.add(row); saveCache();
  render();
  SYNC.push();
  return key;
}
async function deleteRow(table, key){
  if(SOLO_LECTURA){ toast('Modo solo lectura: bórralo desde la laptop'); return; }
  const now=new Date().toISOString();
  const payload={SyncKey:key};
  const row={ table_name:table, sync_key:key, payload:payload,
    payload_hash: await sha256(JSON.stringify(payload)), updated_at:now,
    device_id: 'WEB-'+(CFG.deviceName||'movil'), deleted:true };
  DB[table].delete(key); tocarDatos();
  OUTBOX.add(row); saveCache();
  render();
  SYNC.push();
}

/* ---------------- Caché local (para abrir sin señal) ---------------- */
function saveCache(){
  try{
    const obj={};
    TABLES.forEach(t=>{ obj[t]=[...DB[t].entries()].map(([k,v])=>[k,v]); });
    localStorage.setItem(LS.cache, JSON.stringify(obj));
  }catch(e){ /* sin espacio: la app sigue funcionando online */ }
}
function loadCache(){
  try{
    const obj=JSON.parse(localStorage.getItem(LS.cache)||'null'); if(!obj) return false;
    TABLES.forEach(t=>{ DB[t]=new Map(obj[t]||[]); });
    return true;
  }catch{ return false; }
}
function saveState(){ localStorage.setItem(LS.state, JSON.stringify(STATE)); }
function loadState(){ try{ STATE=Object.assign(STATE,JSON.parse(localStorage.getItem(LS.state)||'{}')); }catch{} }

function openSheet(title, bodyHtml, onMount){

    <h3><span class="sp">${esc(title)}</span><button class="btn s" data-x>✕</button></h3>

/* =====================================================================
   SELECTORES DE DATOS
   ===================================================================== */
const esSpa=(p,spa)=>normalizeText(str(p,'Spa'))===normalizeText(spa);

function serviciosDe(spa,soloActivos=true){
  return rows('ServiciosPrecios',p=>esSpa(p,spa)&&(!soloActivos||num(p,'Activo')===1))
    .sort((a,b)=>str(a,'Servicio').localeCompare(str(b,'Servicio'))||num(a,'DuracionMin')-num(b,'DuracionMin'));
}
function nombresServicio(spa){
  const set=new Map();
  serviciosDe(spa).forEach(s=>{ if(!set.has(str(s,'ServicioNormalizado'))) set.set(str(s,'ServicioNormalizado'),str(s,'Servicio')); });
  return [...set.values()].sort((a,b)=>a.localeCompare(b));
}
function servicioRow(spa,nombre,dur){
  const n=normalizeText(nombre);
  return serviciosDe(spa).find(s=>normalizeText(str(s,'ServicioNormalizado')||str(s,'Servicio'))===n&&num(s,'DuracionMin')===Number(dur))||null;
}
function durasDeServicio(spa,nombre){
  const n=normalizeText(nombre);
  return serviciosDe(spa).filter(s=>normalizeText(str(s,'ServicioNormalizado')||str(s,'Servicio'))===n)
    .map(s=>num(s,'DuracionMin')).sort((a,b)=>a-b);
}
function promosDe(spa,soloActivas=true){
  return rows('Promociones',p=>esSpa(p,spa)&&(!soloActivas||num(p,'Activo')===1))
    .sort((a,b)=>str(a,'Nombre').localeCompare(str(b,'Nombre')));
}
function nombreVisible(m,spa){
  if(normalizeText(spa)==='ULIANOV')
    return str(m,'ApodoUlianov')||str(m,'Apodo')||str(m,'Nombre');
  return str(m,'NombreAdhamar')||str(m,'NombreReal')||str(m,'Nombre');
}
function aliasDe(m){
  return new Set(['Nombre','Apodo','NombreAdhamar','ApodoUlianov','NombreReal']
    .map(k=>normalizeText(str(m,k))).filter(Boolean));
}
function terapeutasDe(spa){
  const ul=normalizeText(spa)==='ULIANOV';
  return rows('Masajistas',p=>num(p,'Activa')===1&&(ul?num(p,'ActivaUlianov')===1:num(p,'ActivaAdhamar')===1))
    .sort((a,b)=>nombreVisible(a,spa).localeCompare(nombreVisible(b,spa)));
}
function buscarTerapeuta(nombre){
  const n=normalizeText(nombre); if(!n) return null;
  return rows('Masajistas').find(m=>aliasDe(m).has(n))||null;
}
function splitNames(t){
  if(!t) return [];
  return String(t).split(/\s*(?:\/|,|;|\+|\by\b)\s*/i).map(x=>x.trim()).filter(Boolean).slice(0,3);
}
function atencionesDe(spa,fecha){
  return rows('Atenciones',p=>esSpa(p,spa)&&str(p,'Fecha').slice(0,10)===fecha)
    .sort((a,b)=>(horaMin(str(a,'HoraInicio'))??0)-(horaMin(str(b,'HoraInicio'))??0));
}
function atencionesRango(spa,desde,hasta){
  return rows('Atenciones',p=>esSpa(p,spa)&&str(p,'Fecha').slice(0,10)>=desde&&str(p,'Fecha').slice(0,10)<=hasta)
    .sort((a,b)=>str(a,'Fecha').localeCompare(str(b,'Fecha'))||(horaMin(str(a,'HoraInicio'))??0)-(horaMin(str(b,'HoraInicio'))??0));
}
function clientesDe(spa){ return rows('Clientes',p=>esSpa(p,spa)); }
function buscarCliente(spa,nombre){
  const n=normalizeText(nombre); if(!n) return null;
  return clientesDe(spa).find(c=>normalizeText(str(c,'NombreNormalizado')||str(c,'Nombre'))===n
                              ||normalizeText(str(c,'CodigoCliente'))===n)||null;
}
function clienteBloqueadoGlobal(nombre){
  const n=normalizeText(nombre); if(!n) return null;
  return rows('Clientes',p=>num(p,'Bloqueado')===1&&normalizeText(str(p,'NombreNormalizado')||str(p,'Nombre'))===n)[0]||null;
}
function cajaDe(spa,fecha){
  return rows('CajaMovimientos',p=>esSpa(p,spa)&&str(p,'Fecha').slice(0,10)===fecha)
    .sort((a,b)=>(horaMin(str(a,'Hora'))??0)-(horaMin(str(b,'Hora'))??0));
}
function asistenciasDe(spa,fecha){
  return rows('AsistenciasTerapeutas',p=>esSpa(p,spa)&&str(p,'Fecha').slice(0,10)===fecha);
}
/* Pagos a terapeutas del día: se reconstruyen desde la atención (1ra/2da/3ra). */
function pagosTerapeutasDia(spa,fecha){
  const map=new Map();
  atencionesDe(spa,fecha).filter(a=>str(a,'Estado')==='Atendido').forEach(a=>{
    const nombres=splitNames(str(a,'MasajistaNombre'));
    const pagos=[num(a,'PagoTerapeuta1'),num(a,'PagoTerapeuta2'),num(a,'PagoTerapeuta3')];
    nombres.forEach((n,i)=>{
      const k=normalizeText(n); if(!k) return;
      if(!map.has(k)) map.set(k,{nombre:n,atenciones:0,total:0});
      const e=map.get(k); e.atenciones++; e.total+=pagos[i]||0;
    });
  });
  return [...map.values()].sort((a,b)=>a.nombre.localeCompare(b.nombre));
}

/* Cuadre del día: mismo cálculo que GetDailySummary (SpaRepository.cs). */
function resumenDia(spa,fecha){
  const ats=atencionesDe(spa,fecha), at=ats.filter(a=>str(a,'Estado')==='Atendido');
  const efectivoDe=a=>pagosDeAtencion(str(a,'MetodoPago'),num(a,'Total'),str(a,'PagosDetalle'))
    .filter(p=>normalizeText(p.metodo)==='EFECTIVO').reduce((s,p)=>s+p.monto,0);
  const porMetodo={};
  at.flatMap(a=>pagosDeAtencion(str(a,'MetodoPago'),num(a,'Total'),str(a,'PagosDetalle')))
    .forEach(p=>{ porMetodo[p.metodo]=(porMetodo[p.metodo]||0)+p.monto; });
  const mv=cajaDe(spa,fecha);
  const sum=(tipo,met)=>mv.filter(m=>str(m,'Tipo')===tipo&&(!met||str(m,'MetodoPago')===met)).reduce((s,m)=>s+num(m,'Monto'),0);
  const efectivoRecibidoReal=at.reduce((s,a)=>{
    const ef=efectivoDe(a); if(ef<=0) return s;
    const simple=!str(a,'PagosDetalle')&&str(a,'MetodoPago')==='Efectivo';
    return s+((simple&&num(a,'EfectivoRecibido')>0)?num(a,'EfectivoRecibido'):ef);
  },0);
  const cajaInicial=sum('Caja inicial','Efectivo'), cajaFinal=sum('Caja final','Efectivo');
  const salidas=sum('Salida','Efectivo'), entradas=sum('Entrada','Efectivo');
  return {
    atenciones:at.length, reservas:ats.filter(a=>str(a,'Estado')==='Reservado').length,
    totalCaja:at.reduce((s,a)=>s+num(a,'Total'),0), porMetodo,
    ventasEfectivo:at.reduce((s,a)=>s+efectivoDe(a),0),
    efectivoRecibidoReal,
    vueltoYape:at.filter(a=>str(a,'MetodoPago')==='Efectivo'&&num(a,'VueltoEnYape')===1).reduce((s,a)=>s+num(a,'VueltoYape'),0),
    cajaInicial, cajaFinal, salidas, entradas,
    cajaEsperada: cajaInicial+efectivoRecibidoReal+entradas-salidas,
    movimientos:mv, ats
  };
}

/* Disponibilidad: SOLO la 1ra terapeuta de cada cita queda ocupada.
   Las citas del día se arman una sola vez por render (DATA_VERSION invalida la caché). */
let _oc={v:-1,f:null,list:null};
function ocupacionDia(fechaISO){
  if(_oc.v===DATA_VERSION&&_oc.f===fechaISO) return _oc.list;
  const list=[];
  rows('Atenciones',p=>str(p,'Fecha').slice(0,10)===fechaISO).forEach(a=>{
    const est=str(a,'Estado');
    if(est==='Cancelado'||est==='No asistió') return;
    if(num(a,'TerminoAntes')===1) return;           // el cliente se fue antes: liberada
    const primera=normalizeText(splitNames(str(a,'MasajistaNombre'))[0]||'');
    if(!primera) return;
    const ini=horaMin(str(a,'HoraInicio')); if(ini===null) return;
    list.push({primera,ini,fin:ini+(num(a,'DuracionMin')||60),at:a});
  });
  _oc={v:DATA_VERSION,f:fechaISO,list};
  return list;
}
function estaLibre(m,fechaISO,desdeMin,durMin){
  const alias=aliasDe(m), fin=desdeMin+durMin;
  const choque=ocupacionDia(fechaISO).find(o=>alias.has(o.primera)&&desdeMin<o.fin&&fin>o.ini);
  return {libre:!choque, hasta:choque?choque.fin:null, cita:choque?choque.at:null};
}
function asistenciaDe(m,spa,fechaISO){
  const al=aliasDe(m);
  return asistenciasDe(spa,fechaISO).find(a=>al.has(normalizeText(str(a,'MasajistaNombre'))))||null;
}

let FORM_SUCIO = false;

function viewAgenda(v){

  if(v.dataset.montada==='1' && FORM_SUCIO){

function htmlZonaLista(){
  const proximas = UI.modoAgenda==='proximas';
  const lista = proximas
    ? rows('Atenciones',p=>esSpa(p,UI.spa)&&str(p,'Fecha').slice(0,10)>hoyISO()&&str(p,'Estado')==='Reservado')
        .sort((a,b)=>str(a,'Fecha').localeCompare(str(b,'Fecha'))||(horaMin(str(a,'HoraInicio'))??0)-(horaMin(str(b,'HoraInicio'))??0))
    : atencionesDe(UI.spa,UI.fecha);
  const r = resumenDia(UI.spa,UI.fecha);
  return `
  <div class="seg" style="margin-bottom:10px">
    <button data-modo="dia" class="${proximas?'':'on'}">Día seleccionado</button>
    <button data-modo="proximas" class="${proximas?'on':''}">Próximas reservas</button>

  ${proximas?'':`<div class="kpi" style="margin-bottom:12px">
    <div><b>${r.atenciones}</b><span>atendidas</span></div>
    <div><b>${r.reservas}</b><span>reservadas</span></div>
    <div><b>S/ ${money(r.totalCaja)}</b><span>cobrado</span></div>
  </div>`}
  <div class="card">
    <h2><span class="sp">${proximas?'Reservas futuras':'Citas del día'}</span>
      <span class="sub">${lista.length}</span></h2>
    <div class="list">
      ${lista.length?lista.map(a=>itemAtencion(a,proximas)).join(''):'<div class="empty">Sin citas registradas.</div>'}
    </div>
  </div>
  ${proximas?'':cardDisponibles()}`;

function bindZonaLista(v){
  v.querySelectorAll('[data-modo]').forEach(b=>b.onclick=()=>{ UI.modoAgenda=b.dataset.modo; repintarLista(v); });
  const z=v.querySelector('#zonaLista')||v;
  z.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{ UI.fecha=addDaysISO(UI.fecha,+b.dataset.dia); repintarLista(v); });
  const h=z.querySelector('[data-hoy]'); if(h) h.onclick=()=>{ UI.fecha=hoyISO(); repintarLista(v); };
  const i=z.querySelector('#fInput'); if(i) i.onchange=()=>{ UI.fecha=i.value||hoyISO(); repintarLista(v); };
  v.querySelectorAll('[data-at]').forEach(n=>n.onclick=()=>detalleAtencion(n.dataset.at));
  bindDisponibles(v);
}
/* Cambiar de día o de vista no debe borrar lo que hay escrito arriba. */
function repintarLista(v){
  const caja=v.querySelector('#zonaLista');
  if(!caja) return render();
  caja.innerHTML=htmlZonaLista(); bindZonaLista(v);
  document.getElementById('topsub').textContent = UI.spa + ' · ' + fechaLarga(UI.fecha);
}
function itemAtencion(a,conFecha){
  const est=str(a,'Estado');
  const bcls=est==='Atendido'?'b-ok':est==='Reservado'?'b-info':est==='Cancelado'?'b-bad':'b-mut';
  const mod=[num(a,'Es4Manos')===1?'4 manos':'',num(a,'EsHolistico')===1?'Holístico':''].filter(Boolean).join(' + ');
  const vip=num(a,'EsVip')===1?'<span class="badge b-gold">VIP</span> ':'';
  return `<div class="item" data-at="${esc(a.__key)}">
    <div class="hh">${conFecha?fechaCorta(str(a,'Fecha')):hora12(str(a,'HoraInicio'))}</div>
    <div class="t">
      <b>${vip}${esc(str(a,'ClienteNombre')||'(sin nombre)')}</b>
      <span>${esc(str(a,'Servicio')||str(a,'PromocionNombre'))} · ${num(a,'DuracionMin')}'${mod?' · '+mod:''}<br>
      ${esc(splitNames(str(a,'MasajistaNombre')).join(' / ')||'sin terapeuta')}</span>
    </div>
    <div class="r">
      <div class="money">S/ ${money(num(a,'Total'))}</div>
      <span class="badge ${bcls}">${esc(est)}</span>
    </div>
  </div>`;
}
function cardDisponibles(){
  const hora=UI.dispHora||horaGuardar(String(new Date().getHours())+':'+String(new Date().getMinutes()).padStart(2,'0'));
  const dur=UI.dispDur||60;
  const min=horaMin(hora)??540;
  const ts=terapeutasDe(UI.spa);
  const filas=ts.map(m=>{
    const as=asistenciaDe(m,UI.spa,UI.fecha);
    const presente = as ? (num(as,'Asistio')===1&&num(as,'SeRetiro')!==1) : null;
    const st=estaLibre(m,UI.fecha,min,Number(dur));
    let badge,txt;
    if(presente===false){ badge='b-mut'; txt='no asiste / se retiró'; }
    else if(!st.libre){ badge='b-bad'; txt='ocupada hasta '+hora12(st.hasta); }
    else { badge='b-ok'; txt=presente===null?'libre (asistencia sin marcar)':'libre'; }
    return `<div class="item" style="cursor:default">
      <div class="t"><b>${esc(nombreVisible(m,UI.spa))}</b><span>${txt}</span></div>
      <div class="r"><span class="badge ${badge}">${presente===false?'—':st.libre?'✓':'✗'}</span></div>
    </div>`;
  }).join('');
  return `<div class="card">
    <h2><span class="sp">Terapeutas disponibles</span></h2>
    <div class="row" style="margin-bottom:10px">
      <div style="flex:1"><label class="f">A las</label><input id="dHora" value="${esc(hora12(hora))}"></div>
      <div style="flex:1"><label class="f">Por (min)</label>
        <select id="dDur">${DURACIONES.map(d=>`<option ${d==dur?'selected':''}>${d}</option>`).join('')}</select></div>
    </div>
    <div class="list">${filas||'<div class="empty">Sin terapeutas activas en este spa.</div>'}</div>
  </div>`;
}
function bindDisponibles(v){
  const h=v.querySelector('#dHora'), d=v.querySelector('#dDur');
  if(h) h.onchange=()=>{ UI.dispHora=horaGuardar(h.value); render(); };
  if(d) d.onchange=()=>{ UI.dispDur=+d.value; render(); };
}

        <span class="badge ${est==='Atendido'?'b-ok':est==='Reservado'?'b-info':'b-mut'}">${esc(est)}</span>
      </div>
      <div style="margin-top:8px" class="sub">
        Servicio: <b>${esc(str(a,'Servicio')||'—')}</b>${str(a,'PromocionNombre')?' · Promo: <b>'+esc(str(a,'PromocionNombre'))+'</b>':''}<br>
        Terapeuta(s): <b>${esc(splitNames(str(a,'MasajistaNombre')).join(' / ')||'—')}</b><br>
        Modalidad: ${num(a,'Es4Manos')===1?'4 manos ':''}${num(a,'EsHolistico')===1?'Holístico':''}${!num(a,'Es4Manos')&&!num(a,'EsHolistico')?'básico':''}<br>
        Caja: ${esc(str(a,'Spa'))} · Catálogo: ${esc(str(a,'SpaServicio')||str(a,'Spa'))}
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:10px 0">
      <div class="row" style="justify-content:space-between"><span>Precio</span><span class="money">S/ ${money(num(a,'PrecioBase'))}</span></div>
      ${num(a,'DescuentoPorcentaje')>0?`<div class="row" style="justify-content:space-between;color:var(--gold-dark)"><span>Descuento</span><span class="money">− S/ ${money(num(a,'DescuentoPorcentaje'))}</span></div>`:''}
      <div class="row" style="justify-content:space-between;font-size:17px"><b>Total</b><b class="money">S/ ${money(num(a,'Total'))}</b></div>
      <div class="sub" style="margin-top:6px">Pago: ${esc(pagos.map(p=>p.metodo+' S/ '+money(p.monto)).join(' + '))}
      ${num(a,'VueltoEnYape')===1?'<br>Vuelto por Yape: S/ '+money(num(a,'VueltoYape')):''}
      ${num(a,'EfectivoRecibido')>0?'<br>Efectivo recibido: S/ '+money(num(a,'EfectivoRecibido')):''}</div>
      <div class="sub" style="margin-top:6px">Pago terapeuta: S/ ${money(num(a,'PagoTerapeuta1'))}${num(a,'PagoTerapeuta2')>0?' / S/ '+money(num(a,'PagoTerapeuta2')):''}</div>
      ${str(a,'Observacion')?'<div class="infobox">'+esc(str(a,'Observacion'))+'</div>':''}
    </div>
    <div class="grid g2" data-acciones>
      ${est!=='Atendido'?'<button class="btn p" data-cobrar>✓ Marcar atendido</button>':''}
      <button class="btn" data-editar>✎ Editar</button>
      ${est==='Reservado'?'<button class="btn" data-noasistio>Ⓧ No asistió</button>':''}
      <button class="btn" data-antes>${num(a,'TerminoAntes')===1?'↺ Quitar «se fue antes»':'⏱ El cliente se fue antes'}</button>
      <button class="btn d" data-borrar>🗑 Borrar cita</button>
    </div>`, ovl=>{
    ovl._datos();
    const q=s=>ovl.querySelector(s);
    q('[data-editar]').onclick=()=>{ closeSheet(); formAtencion(a); };
    if(q('[data-cobrar]')) q('[data-cobrar]').onclick=async()=>{ await saveRow('Atenciones',{Estado:'Atendido'},a); closeSheet(); toast('Marcada como atendida'); };
    if(q('[data-noasistio]')) q('[data-noasistio]').onclick=async()=>{ await saveRow('Atenciones',{Estado:'No asistió'},a); closeSheet(); toast('Marcada: no asistió'); };
    q('[data-antes]').onclick=async()=>{ await saveRow('Atenciones',{TerminoAntes:num(a,'TerminoAntes')===1?0:1},a); closeSheet(); toast('Actualizado'); };
    q('[data-borrar]').onclick=()=>confirmar('¿Borrar esta cita en todas las terminales?',async()=>{ await deleteRow('Atenciones',key); toast('Cita borrada'); });
  });
}

/* =====================================================================
   FORMULARIO · ATENCIÓN
   ===================================================================== */
function formAtencion(existing){   // ventana emergente: solo para EDITAR una cita ya guardada
  openSheet('Editar cita', `<div id="fa"></div>`, ovl=>{
    montarFormAtencion(ovl.querySelector('#fa'), existing, ovl);
  });
}

/* El MISMO formulario sirve en la primera pantalla y en la ventana de edición.
   Con ovl = null se dibuja dentro de la pantalla, con los botones PAGO y RESERVA. */
function montarFormAtencion(cont, existing, ovl){
  const nueva=!existing, inline=!ovl;
  const S={
    spa: existing?str(existing,'Spa'):UI.spa,
    spaServicio: existing?(str(existing,'SpaServicio')||str(existing,'Spa')):UI.spa,
    fecha: existing?str(existing,'Fecha').slice(0,10):UI.fecha,
    hora: existing?str(existing,'HoraInicio'):horaGuardar(String(new Date().getHours())+':'+String(new Date().getMinutes()).padStart(2,'0')),
    dur: existing?num(existing,'DuracionMin'):60,
    cliente: existing?str(existing,'ClienteNombre'):'',
    servicio: existing?str(existing,'Servicio'):'',
    promo: existing?str(existing,'PromocionNombre'):'',
    mod: existing?(num(existing,'Es4Manos')===1&&num(existing,'EsHolistico')===1?'hol4':num(existing,'Es4Manos')===1?'4m':num(existing,'EsHolistico')===1?'hol':'base'):'base',
    t1: existing?(splitNames(str(existing,'MasajistaNombre'))[0]||''):'',
    t2: existing?(splitNames(str(existing,'MasajistaNombre'))[1]||''):'',
    precio: existing?num(existing,'PrecioBase'):0,
    desc: existing?num(existing,'DescuentoPorcentaje'):0,
    p1: existing?num(existing,'PagoTerapeuta1'):0,
    p2: existing?num(existing,'PagoTerapeuta2'):0,
    metodo: existing?str(existing,'MetodoPago'):'Efectivo',
    mixto: existing?pagosParsear(str(existing,'PagosDetalle')):[],
    efectivoRec: existing?num(existing,'EfectivoRecibido'):0,
    vueltoYape: existing?num(existing,'VueltoEnYape')===1:false,
    montoVuelto: existing?num(existing,'VueltoYape'):0,
    estado: existing?str(existing,'Estado'):'Atendido',
    vip: existing?num(existing,'EsVip')===1:false,
    obs: existing?str(existing,'Observacion'):'',
    // 2 terapeutas si la cita ya venía con dos nombres o con modalidad de 4 manos.
    terapeutas2: (existing && (splitNames(str(existing,'MasajistaNombre')).length>1 || num(existing,'Es4Manos')===1)) ? 2 : 1
  };

    const draw=()=>{ cont.innerHTML=htmlForm(); bind(); if(ovl) ovl._datos(); };

    function catalogo(){
      if(S.promo){
        const pr=promosDe(S.spaServicio,false).find(p=>str(p,'Nombre')===S.promo);
        return pr?{tipo:'promo',row:pr}:null;
      }
      const sr=servicioRow(S.spaServicio,S.servicio,S.dur);
      return sr?{tipo:'servicio',row:sr}:null;
    }
    function modsDisponibles(){
      const c=catalogo(); if(!c) return {m4:false,hol:false,h4:false};
      const r=c.row;
      if(c.tipo==='promo') return {m4:num(r,'Aplica4Manos')===1,hol:num(r,'AplicaHolistico')===1,h4:num(r,'AplicaHol4Manos')===1};
      return {m4:num(r,'Disp4Manos')===1&&DUR_VARIANTES.includes(S.dur),
              hol:num(r,'DispHolistico')===1&&DUR_HOLISTICO.includes(S.dur),
              h4:num(r,'DispHol4Manos')===1&&DUR_VARIANTES.includes(S.dur)};
    }
    /* Precio + pagos según catálogo y modalidad (misma tabla que ApplyServiceDefaults). */
    function aplicarCatalogo(){
      const c=catalogo(); if(!c){ S.terapeutas2=1; return; }
      const r=c.row, promo=c.tipo==='promo';
      if(promo&&num(r,'EsPaquete')===1){
        S.precio=num(r,'PrecioPromocional'); S.p1=num(r,'PagoTerapeuta1'); S.p2=num(r,'PagoTerapeuta2');
        S.terapeutas2=Math.min(2,Math.max(1,num(r,'TerapeutasDefault')||1));
        S.dur=num(r,'DuracionMin')||S.dur; return;
      }
      if(S.mod==='hol4'){ S.precio=promo?num(r,'PrecioHol4Manos'):num(r,'PrecioHol4Manos');
        S.p1=num(r,'PagoT1_Hol4Manos'); S.p2=num(r,'PagoT2_Hol4Manos'); S.terapeutas2=2; }
      else if(S.mod==='4m'){ S.precio=num(r,'Precio4Manos');
        S.p1=num(r,'PagoT1_4Manos'); S.p2=num(r,'PagoT2_4Manos'); S.terapeutas2=2; }
      else if(S.mod==='hol'){ S.precio=num(r,'PrecioHolistico');
        S.p1=num(r,'PagoT1_Holistico'); S.p2=0; S.terapeutas2=1; }
      else{
        S.precio=promo?num(r,'PrecioPromocional'):num(r,'Precio');
        S.p1=num(r,'PagoTerapeuta1'); S.p2=num(r,'PagoTerapeuta2');
        S.terapeutas2=Math.min(2,Math.max(1,num(r,'TerapeutasDefault')||1));
      }
      if(promo){ S.desc=0; if(num(r,'DuracionMin')>0&&S.mod==='base') S.dur=num(r,'DuracionMin'); }
    }
    /* Descuento sugerido: solo sin promoción y con VIP/Antiguo vigente. */
    function descSugerido(){
      if(S.promo) return 0;
      const c=buscarCliente(S.spa,S.cliente);
      return (c&&tieneDescuentoFijo(c,S.fecha))?descuentoPorSpa(S.spaServicio):0;
    }
    const total=()=>Math.max(0,Math.round((S.precio-Math.min(S.desc,S.precio))*100)/100);

    function htmlForm(){
      const c=buscarCliente(S.spa,S.cliente);
      const blk=clienteBloqueadoGlobal(S.cliente);
      const mods=modsDisponibles();
      const ts=terapeutasDe(S.spa);
      const durs=S.servicio?durasDeServicio(S.spaServicio,S.servicio):duracionesBasicas(S.spaServicio);
      const opt=(arr,val)=>arr.map(x=>`<option ${String(x)===String(val)?'selected':''}>${esc(x)}</option>`).join('');
      let aviso='';
      if(blk) aviso=`<div class="warnbox">⚠ CLIENTE REPORTADO / BLOQUEADO — NO ATENDER. Motivo: ${esc(str(blk,'MotivoBloqueo')||'sin motivo registrado')}</div>`;
      else if(S.cliente&&!c) aviso=`<div class="infobox">Cliente nuevo: se registrará al guardar. Si ya vino antes, revisa cómo se escribió el nombre.</div>`;
      else if(c){
        const est=[]; if(vipVigente(c,S.fecha))est.push('VIP'); if(antiguoVigente(c,S.fecha))est.push('Antiguo');
        aviso=`<div class="infobox">Cliente conocido · ${num(c,'Veces')} visita(s)${str(c,'UltimaVisita')?' · última: '+fechaCorta(str(c,'UltimaVisita')):''}
          ${est.length?` · <b>${est.join(' y ')}: descuento S/ ${descuentoPorSpa(S.spaServicio)}</b>`:''}</div>`;
      }
      const otroSpa = SPAS.find(x=>normalizeText(x)!==normalizeText(S.spa)) || 'Ulianov';
      const esDelOtro = normalizeText(S.spaServicio)!==normalizeText(S.spa);
      return `
      <div class="grid g3">
        <div><label class="f">Fecha</label><input type="date" data-k="fecha" value="${S.fecha}"></div>
        <div><label class="f">Hora cita</label><input data-k="hora" value="${esc(hora12(S.hora))}" placeholder="5:00 PM"></div>
        <div><label class="f">Tiempo</label><select data-k="dur">${opt(durs.length?durs:duracionesBasicas(S.spaServicio),S.dur)}</select></div>
      </div>
      <div style="margin-top:8px" class="suggest">
        <label class="f">Cliente</label>
        <input data-k="cliente" id="inCli" value="${esc(S.cliente)}" placeholder="Nombre del cliente" autocomplete="off">
        <div class="box hide" id="cliBox"></div>
      </div>
      ${aviso}
      <label class="chk"><input type="checkbox" data-k="otroSpa" ${esDelOtro?'checked':''}> Servicio de ${esc(otroSpa)}</label>
      <div class="grid g2" style="margin-top:4px">
        <div><label class="f">Servicio</label>
          <select data-k="servicio"><option value="">— elegir —</option>${opt(nombresServicio(S.spaServicio),S.servicio)}</select></div>
        <div><label class="f">Promoción / paquete</label>
          <select data-k="promo"><option value="">Sin promoción</option>${
            promosDe(S.spaServicio).map(p=>`<option ${str(p,'Nombre')===S.promo?'selected':''}>${esc(str(p,'Nombre'))}</option>`).join('')}</select></div>
      </div>
      ${(mods.m4||mods.hol||mods.h4)?`<div style="margin-top:8px"><label class="f">Modalidad</label>
        <div class="seg">
          <button type="button" data-mod="base" class="${S.mod==='base'?'on':''}">Básico</button>
          ${mods.m4?`<button type="button" data-mod="4m" class="${S.mod==='4m'?'on':''}">4 manos</button>`:''}
          ${mods.hol?`<button type="button" data-mod="hol" class="${S.mod==='hol'?'on':''}">Holístico</button>`:''}
          ${mods.h4?`<button type="button" data-mod="hol4" class="${S.mod==='hol4'?'on':''}">Hol+4m</button>`:''}
        </div></div>`:''}
      <div class="grid g2" style="margin-top:8px">
        <div><label class="f">Terapeuta 1</label>
          <select data-k="t1"><option value="">— sin asignar —</option>${
            ts.map(m=>{const n=nombreVisible(m,S.spa);
              const st=estaLibre(m,S.fecha,horaMin(S.hora)??540,S.dur);
              return `<option ${normalizeText(n)===normalizeText(S.t1)?'selected':''}>${esc(n)}</option>`;}).join('')}</select></div>
        ${S.terapeutas2>=2?`<div><label class="f">Terapeuta 2 (4 manos)</label>
          <select data-k="t2"><option value="">— sin asignar —</option>${
            ts.map(m=>{const n=nombreVisible(m,S.spa);
              return `<option ${normalizeText(n)===normalizeText(S.t2)?'selected':''}>${esc(n)}</option>`;}).join('')}</select></div>`:''}
      </div>
      ${avisoOcupada()}
      <div class="grid g3" style="margin-top:8px">
        <div><label class="f">Precio S/</label><input type="number" step="0.5" data-k="precio" value="${S.precio}"></div>
        <div><label class="f">Descuento S/</label><input type="number" step="1" data-k="desc" value="${S.desc}"></div>
        <div><label class="f">Total</label><input value="S/ ${money(total())}" disabled style="font-weight:700"></div>
      </div>
      <div class="grid g2" style="margin-top:8px">
        <div><label class="f">Pago terapeuta 1</label><input type="number" step="0.5" data-k="p1" value="${S.p1}"></div>
        ${S.terapeutas2>=2?`<div><label class="f">Pago terapeuta 2</label><input type="number" step="0.5" data-k="p2" value="${S.p2}"></div>`:''}
      </div>
      <div class="grid g2" style="margin-top:8px">
        <div><label class="f">Medio de pago</label>
          <select data-k="metodo">${opt(METODOS.concat(['Mixto']),S.metodo)}</select></div>
        ${inline?'':`<div><label class="f">Estado</label><select data-k="estado">${opt(ESTADOS,S.estado)}</select></div>`}
      </div>
      ${S.metodo==='Mixto'?htmlMixto():''}
      ${S.metodo==='Efectivo'?`<div class="grid g3" style="margin-top:8px">
        <div><label class="f">Efectivo recibido</label><input type="number" step="1" data-k="efectivoRec" value="${S.efectivoRec}"></div>
        <div><label class="f">Vuelto</label><input value="S/ ${money(Math.max(0,S.efectivoRec-total()))}" disabled></div>
        <div style="align-self:end"><label class="chk"><input type="checkbox" data-k="vueltoYape" ${S.vueltoYape?'checked':''}> Vuelto por Yape</label></div>
      </div>${S.vueltoYape?`<div style="margin-top:6px"><label class="f">Monto devuelto por Yape</label><input type="number" step="1" data-k="montoVuelto" value="${S.montoVuelto}"></div>`:''}`:''}
      <div style="margin-top:8px"><label class="chk"><input type="checkbox" data-k="vip" ${S.vip?'checked':''}> Marcar la cita como VIP</label></div>
      <div style="margin-top:4px"><label class="f">Obs</label><textarea data-k="obs" rows="2" placeholder="Observación opcional">${esc(S.obs)}</textarea></div>
      ${inline?`
      <div class="cobro">
        <div><span>Total a cobrar</span><b>S/ ${money(total())}</b></div>
        <div class="row">
          <button class="btn p" data-pago>PAGO</button>
          <button class="btn" data-reserva>RESERVA</button>
          <button class="btn s" data-limpiar>Limpiar</button>
        </div>
      </div>`:`
      <div class="sticky-actions">
        <button class="btn" data-cancel>Cancelar</button>
        <button class="btn p" data-save>Guardar cambios</button>
      </div>`}`;
    }
    function htmlMixto(){
      const l=S.mixto.length?S.mixto:[{metodo:'Efectivo',monto:0},{metodo:'Yape',monto:0}];
      S.mixto=l;
      return `<div class="card" style="margin:8px 0 0;padding:10px">
        <div class="sub" style="margin-bottom:6px">Desglose del pago (debe sumar S/ ${money(total())})</div>
        ${l.map((p,i)=>`<div class="row" style="margin-bottom:6px">
          <select data-mx="${i}" data-mf="metodo" style="flex:2">${METODOS.map(m=>`<option ${m===p.metodo?'selected':''}>${m}</option>`).join('')}</select>
          <input type="number" step="0.5" data-mx="${i}" data-mf="monto" value="${p.monto}" style="flex:1">
        </div>`).join('')}
        <button class="btn s" data-mxadd>+ agregar medio</button>
        <span class="sub" style="margin-left:8px">suma: S/ ${money(S.mixto.reduce((s,p)=>s+(+p.monto||0),0))}</span>
      </div>`;
    }
    function avisoOcupada(){
      if(!S.t1) return '';
      const m=buscarTerapeuta(S.t1); if(!m) return '';
      const st=estaLibre(m,S.fecha,horaMin(S.hora)??540,S.dur);
      if(st.libre) return '';
      const key=existing&&existing.__key;
      if(st.cita&&st.cita.__key===key) return '';
      return `<div class="warnbox">⚠ ${esc(S.t1)} ya está ocupada a esa hora (libre desde ${hora12(st.hasta)}).</div>`;
    }

    function bind(){
      cont.querySelectorAll('[data-k]').forEach(inp=>{
        const k=inp.dataset.k;
        const ev=(inp.tagName==='SELECT'||inp.type==='checkbox'||inp.type==='date')?'change':'change';
        inp.addEventListener(ev,()=>{
          if(inline) FORM_SUCIO=true;
          if(inp.type==='checkbox') S[k]=inp.checked;
          else if(inp.type==='number') S[k]=parseFloat(inp.value)||0;
          else S[k]=inp.value;
          // "Servicio de Ulianov": cambia el catálogo del que sale el precio.
          if(k==='otroSpa'){
            S.spaServicio = inp.checked ? (SPAS.find(x=>normalizeText(x)!==normalizeText(S.spa))||S.spa) : S.spa;
            S.servicio=''; S.promo=''; S.mod='base'; aplicarCatalogo(); S.desc=descSugerido();
          }
          if(k==='hora') S.hora=horaGuardar(inp.value);
          if(k==='dur') S.dur=+inp.value;
          if(k==='servicio'){ S.promo=''; S.mod='base';
            const d=durasDeServicio(S.spaServicio,S.servicio); if(d.length&&!d.includes(S.dur)) S.dur=d.includes(60)?60:d[0];
            aplicarCatalogo(); S.desc=descSugerido(); }
          if(k==='promo'){ if(S.promo) S.servicio=''; S.mod='base'; aplicarCatalogo(); S.desc=descSugerido(); }
          if(k==='spaServicio'){ S.servicio=''; S.promo=''; aplicarCatalogo(); S.desc=descSugerido(); }
          if(k==='cliente'||k==='fecha') S.desc=descSugerido();
          draw();
        });
      });
      cont.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{ S.mod=b.dataset.mod; aplicarCatalogo(); draw(); });
      cont.querySelectorAll('[data-mx]').forEach(inp=>inp.addEventListener('change',()=>{
        const i=+inp.dataset.mx, f=inp.dataset.mf;
        S.mixto[i][f] = f==='monto' ? (parseFloat(inp.value)||0) : inp.value;
        draw();
      }));
      const add=cont.querySelector('[data-mxadd]');
      if(add) add.onclick=()=>{ S.mixto.push({metodo:'Yape',monto:0}); draw(); };

      /* Autocompletado de cliente */
      const inCli=cont.querySelector('#inCli'), box=cont.querySelector('#cliBox');
      if(inCli){
        inCli.addEventListener('input',()=>{
          S.cliente=inCli.value;
          const q=normalizeText(inCli.value);
          if(q.length<2){ box.classList.add('hide'); return; }
          const hits=clientesDe(S.spa).filter(c=>normalizeText(str(c,'Nombre')).includes(q)||normalizeText(str(c,'CodigoCliente'))===q).slice(0,8);
          if(!hits.length){ box.classList.add('hide'); return; }
          box.innerHTML=hits.map(c=>{
            const t=[]; if(vipVigente(c,S.fecha))t.push('VIP'); if(antiguoVigente(c,S.fecha))t.push('Antiguo');
            if(num(c,'Bloqueado')===1)t.push('⚠ BLOQUEADO');
            return `<div data-pick="${esc(str(c,'Nombre'))}">${esc(str(c,'Nombre'))}
              <span class="sub"> · ${num(c,'Veces')} visitas${t.length?' · '+t.join(', '):''}</span></div>`;
          }).join('');
          box.classList.remove('hide');
          box.querySelectorAll('[data-pick]').forEach(d=>d.onclick=()=>{
            S.cliente=d.dataset.pick; S.desc=descSugerido(); box.classList.add('hide'); draw();
          });
        });
        inCli.addEventListener('blur',()=>setTimeout(()=>box.classList.add('hide'),200));
      }
      const bt=(sel,fn)=>{ const e=cont.querySelector(sel); if(e) e.onclick=fn; };
      bt('[data-cancel]', closeSheet);
      bt('[data-save]', ()=>guardar());
      bt('[data-pago]', ()=>guardar('Atendido'));      // cobrada ahora
      bt('[data-reserva]', ()=>guardar('Reservado'));  // queda agendada
      bt('[data-limpiar]', ()=>{ FORM_SUCIO=false; render(); });
    }

    async function guardar(estadoForzado){
      if(!S.cliente.trim()) return toast('Falta el nombre del cliente');
      if(!S.servicio&&!S.promo) return toast('Elige un servicio o una promoción');
      const estado = estadoForzado || S.estado;
      const t=total();
      if(S.metodo==='Mixto'){
        const suma=S.mixto.reduce((s,p)=>s+(+p.monto||0),0);
        if(Math.abs(suma-t)>0.009) return toast('El desglose suma S/ '+money(suma)+' y el total es S/ '+money(t));
      }
      const nombres=[S.t1,S.terapeutas2>=2?S.t2:''].filter(Boolean).map(titleName);
      const data={
        Spa:S.spa, SpaServicio:S.spaServicio, Fecha:S.fecha, HoraInicio:horaGuardar(S.hora),
        DuracionMin:S.dur,
