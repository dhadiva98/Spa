function viewReportes(v){
  if(!UI.repDesde){ UI.repDesde=addDaysISO(hoyISO(),-29); UI.repHasta=hoyISO(); }
  const ats=atencionesRango(UI.spa,UI.repDesde,UI.repHasta).filter(a=>str(a,'Estado')==='Atendido');
  const total=ats.reduce((s,a)=>s+num(a,'Total'),0);
  const porMetodo={}; ats.flatMap(a=>pagosDeAtencion(str(a,'MetodoPago'),num(a,'Total'),str(a,'PagosDetalle')))
    .forEach(p=>porMetodo[p.metodo]=(porMetodo[p.metodo]||0)+p.monto);
  const porServicio={}; ats.forEach(a=>{ const k=str(a,'Servicio')||'—';
    if(!porServicio[k]) porServicio[k]={n:0,t:0}; porServicio[k].n++; porServicio[k].t+=num(a,'Total'); });
  const porTerapeuta={}; ats.forEach(a=>{
    const nombres=splitNames(str(a,'MasajistaNombre')); const pg=[num(a,'PagoTerapeuta1'),num(a,'PagoTerapeuta2'),num(a,'PagoTerapeuta3')];
    nombres.forEach((n,i)=>{ if(!porTerapeuta[n]) porTerapeuta[n]={n:0,t:0,v:0};
      porTerapeuta[n].n++; porTerapeuta[n].t+=pg[i]||0; porTerapeuta[n].v+=i===0?num(a,'Total'):0; });});
  const porCliente={}; ats.forEach(a=>{ const k=str(a,'ClienteNombre')||'—';
    if(!porCliente[k]) porCliente[k]={n:0,t:0}; porCliente[k].n++; porCliente[k].t+=num(a,'Total'); });
  const porDia={}; ats.forEach(a=>{ const k=str(a,'Fecha').slice(0,10); porDia[k]=(porDia[k]||0)+num(a,'Total'); });
  const tabla=(obj,cols,orden)=>Object.entries(obj).sort((a,b)=>orden(b[1])-orden(a[1])).slice(0,25)
    .map(([k,x])=>`<tr><td>${esc(k)}</td>${cols.map(c=>`<td class="n">${c(x)}</td>`).join('')}</tr>`).join('');
  const maxDia=Math.max(1,...Object.values(porDia));
  v.innerHTML=`
  <div class="card">
    <h2><span class="sp">Rango</span></h2>
    <div class="grid g2">
      <div><label class="f">Desde</label><input type="date" id="rd" value="${UI.repDesde}"></div>
      <div><label class="f">Hasta</label><input type="date" id="rh" value="${UI.repHasta}"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn s" data-rango="7">7 días</button>
      <button class="btn s" data-rango="30">30 días</button>
      <button class="btn s" data-rango="90">90 días</button>
      <div style="flex:1"></div>
      <button class="btn s" data-csv>⇩ CSV</button>
    </div>
  </div>
  <div class="kpi" style="margin-bottom:12px">
    <div><b>${ats.length}</b><span>atenciones</span></div>
    <div><b>S/ ${money(total)}</b><span>facturado</span></div>
    <div><b>S/ ${money(ats.length?total/ats.length:0)}</b><span>ticket promedio</span></div>
    <div><b>S/ ${money(ats.reduce((s,a)=>s+num(a,'PagoTerapeuta1')+num(a,'PagoTerapeuta2')+num(a,'PagoTerapeuta3'),0))}</b><span>pago terapeutas</span></div>
  </div>
  <div class="card"><h2>Por día</h2>
    ${Object.keys(porDia).length?Object.entries(porDia).sort().map(([d,t])=>`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span class="sub" style="width:52px;flex:none">${fechaCorta(d).slice(0,5)}</span>
        <div style="flex:1;background:var(--card-2);border-radius:6px;overflow:hidden;height:16px">
          <div style="width:${(t/maxDia*100).toFixed(1)}%;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-dark))"></div></div>
        <span class="money" style="width:78px;text-align:right;font-size:12px">S/ ${money(t)}</span>
      </div>`).join(''):'<div class="empty">Sin datos.</div>'}
  </div>
  <div class="card"><h2>Por medio de pago</h2><table>
    ${Object.entries(porMetodo).sort((a,b)=>b[1]-a[1]).map(([m,t])=>`<tr><td>${esc(m)}</td><td class="n money">S/ ${money(t)}</td></tr>`).join('')||'<tr><td class="sub">Sin datos</td></tr>'}
  </table></div>
  <div class="card"><h2>Por servicio</h2><div class="scroll-x"><table>
    <tr><th>Servicio</th><th class="n">Citas</th><th class="n">Total</th></tr>
    ${tabla(porServicio,[x=>x.n,x=>'S/ '+money(x.t)],x=>x.t)}
  </table></div></div>
  <div class="card"><h2>Por terapeuta</h2><div class="scroll-x"><table>
    <tr><th>Terapeuta</th><th class="n">Citas</th><th class="n">Ventas</th><th class="n">A pagar</th></tr>
    ${tabla(porTerapeuta,[x=>x.n,x=>'S/ '+money(x.v),x=>'S/ '+money(x.t)],x=>x.t)}
  </table></div></div>
  <div class="card"><h2>Clientes más frecuentes</h2><div class="scroll-x"><table>
    <tr><th>Cliente</th><th class="n">Visitas</th><th class="n">Gastado</th></tr>
    ${tabla(porCliente,[x=>x.n,x=>'S/ '+money(x.t)],x=>x.n)}
  </table></div></div>`;
  const rd=v.querySelector('#rd'), rh=v.querySelector('#rh');
  rd.onchange=()=>{ UI.repDesde=rd.value; render(); };
  rh.onchange=()=>{ UI.repHasta=rh.value; render(); };
  v.querySelectorAll('[data-rango]').forEach(b=>b.onclick=()=>{
    UI.repHasta=hoyISO(); UI.repDesde=addDaysISO(hoyISO(),-(+b.dataset.rango-1)); render(); });
  v.querySelector('[data-csv]').onclick=()=>exportarCSV(ats);
}
function exportarCSV(ats){
  const cols=['Fecha','HoraInicio','Spa','SpaServicio','ClienteNombre','MasajistaNombre','Servicio','PromocionNombre',
    'DuracionMin','PrecioBase','DescuentoPorcentaje','Total','MetodoPago','PagosDetalle','Estado','Observacion'];
  const cab=['Fecha','Hora','Caja','Catálogo','Cliente','Terapeuta(s)','Servicio','Promoción','Min','Precio','Descuento S/','Total','Pago','Desglose','Estado','Observación'];
  const esc2=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const csv=[cab.join(';')].concat(ats.map(a=>cols.map(c=>esc2(a[c]??'')).join(';'))).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`ADHULIAV_${UI.spa}_${UI.repDesde}_a_${UI.repHasta}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('CSV descargado');
}

/* =====================================================================
   ENTRADA
   Tres pasos, y los tres son obligatorios:
     activar → la administradora sella este equipo (una sola vez)
     login   → la persona entra con su usuario y contraseña
     pin     → después, a diario, solo el PIN
   ===================================================================== */
function showGate(paso, extra){
  document.getElementById('app').classList.add('hide');
  document.getElementById('gate').classList.remove('hide');
  const b=document.getElementById('gateBody');
  const g=s=>b.querySelector(s);

  /* ---------- Paso 1: activar el equipo (solo la administradora) ---------- */
  if(paso==='activar'){
    const c=CFG||{};
    b.innerHTML=`
      <p class="sub">Este equipo todavía no está activado. La activación la hace
      <b>la administradora</b>, una sola vez por equipo.</p>
      <div style="margin-top:10px"><label class="f">URL del proyecto Supabase</label>
        <input id="cUrl" value="${esc(c.url||'')}" placeholder="https://xxxxxxxx.supabase.co" autocapitalize="off" spellcheck="false"></div>
      <div style="margin-top:8px"><label class="f">Clave pública (anon key)</label>
        <textarea id="cKey" rows="3" placeholder="eyJhbGciOi..." spellcheck="false">${esc(c.key||'')}</textarea></div>
      <div style="margin-top:8px"><label class="f">Nombre para este equipo</label>
        <input id="cDev" value="${esc(c.deviceName||'')}" placeholder="Ej. Celular de recepción"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <p class="sub">Ahora entra <b>tú</b> con tu cuenta de administradora para autorizarlo:</p>
      <div style="margin-top:8px"><label class="f">Tu usuario</label>
        <input id="aMail" autocapitalize="off" spellcheck="false" placeholder="admin@adhamar.local"></div>
      <div style="margin-top:8px"><label class="f">Tu contraseña</label>
        <input id="aPass" type="password"></div>
      <div id="cMsg"></div>
      <button class="btn p w" id="cSave" style="margin-top:12px">Activar este equipo</button>
      ${c.activado?'<button class="btn w" id="cBack" style="margin-top:8px">Volver</button>':''}
      <p class="sub" style="margin-top:12px">Sin este paso, el equipo no puede leer nada: la nube exige que
      esté registrado. Después de activarlo, cada persona entra con su propia cuenta.</p>`;
    const msg=g('#cMsg');
    if(g('#cBack')) g('#cBack').onclick=()=>showGate(localStorage.getItem(LS.sess)?'pin':'login');
    g('#cSave').onclick=async()=>{
      const url=g('#cUrl').value.trim().replace(/\/+$/,'');
      const key=g('#cKey').value.trim();
      const nombreEquipo=g('#cDev').value.trim();
      const mail=g('#aMail').value.trim(), pass=g('#aPass').value;
      if(!/^https:\/\/.+/.test(url)) return msg.innerHTML='<div class="warnbox">La URL debe empezar con https://</div>';
      if(key.length<30) return msg.innerHTML='<div class="warnbox">La clave anon parece incompleta.</div>';
      if(!nombreEquipo) return msg.innerHTML='<div class="warnbox">Ponle un nombre al equipo para reconocerlo después.</div>';
      if(!mail||!pass) return msg.innerHTML='<div class="warnbox">Faltan tu usuario y contraseña.</div>';
      msg.innerHTML='<div class="infobox">Comprobando…</div>';
      const prev=CFG;
      CFG={url, key, deviceName:nombreEquipo,
           deviceId:(prev&&prev.deviceId)||newGuid()+newGuid(),
           activado:false, dias:(prev&&prev.dias)||120, refresh:(prev&&prev.refresh)||7,
           spa:(prev&&prev.spa)||'Adhamar'};
      try{
        await API.pingClaves();
        await AUTH.entrar(mail,pass);
        await AUTH.ficha();
        if(!AUTH.esAdmin()){ AUTH.salir(); CFG=prev;
          return msg.innerHTML='<div class="warnbox">Esa cuenta no es de administradora, así que no puede activar equipos.<br>'+
            'Si eres tú, revisa que te hayas agregado con rol <b>admin</b> en el paso 6 del archivo SQL.</div>'; }
        await API.insertar('adhuliav_web_dispositivos',
          [{device_id:CFG.deviceId, nombre:nombreEquipo, activo:true, creado_por:AUTH.sesion.uid}]);
      }catch(e){
        CFG=prev; AUTH.salir();
        return msg.innerHTML=`<div class="warnbox">No se pudo activar.<br>${esc(e.message==='SESION_VENCIDA'?'La nube rechazó el permiso: revisa que ejecutaste SUPABASE_1_SEGURIDAD.sql.':e.message)}</div>`;
      }
      CFG.activado=true; saveCfg();
      AUTH.salir();
      STATE={lastPull:null,loaded:false}; saveState();
      localStorage.removeItem(LS.cache); localStorage.removeItem(LS.sess);
      showGate('login', {aviso:'✓ Equipo activado. Ahora entra con la cuenta de quien va a usarlo.'});
    };
    return;
  }

  /* ---------- Paso 2: la persona entra con su cuenta ---------- */
  if(paso==='login'){
    b.innerHTML=`
      ${extra&&extra.aviso?`<div class="infobox">${esc(extra.aviso)}</div>`:''}
      <p class="sub">Equipo: <b>${esc(CFG.deviceName||'este equipo')}</b></p>
      <div style="margin-top:10px"><label class="f">Usuario</label>
        <input id="lMail" autocapitalize="off" spellcheck="false" placeholder="tunombre@adhamar.local"></div>
      <div style="margin-top:8px"><label class="f">Contraseña</label>
        <input id="lPass" type="password"></div>
      <div id="lMsg"></div>
      <button class="btn p w" id="lOk" style="margin-top:12px">Entrar</button>
      <button class="btn w" id="lCfg" style="margin-top:8px">Activar otro equipo (administradora)</button>`;
    const msg=g('#lMsg');
    const entrar=async()=>{
      const mail=g('#lMail').value.trim(), pass=g('#lPass').value;
      if(!mail||!pass) return msg.innerHTML='<div class="warnbox">Faltan tus datos.</div>';
      msg.innerHTML='<div class="infobox">Entrando…</div>';
      try{
        await AUTH.entrar(mail,pass);
        await AUTH.ficha();
        if(!AUTH.sesion.activo){ AUTH.salir();
          return msg.innerHTML='<div class="warnbox">Esta cuenta no tiene acceso a la web. Habla con la administradora.</div>'; }
        if(!await API.equipoActivo()){ AUTH.salir();
          return msg.innerHTML='<div class="warnbox">Este equipo ya no está autorizado. La administradora debe activarlo otra vez.</div>'; }
      }catch(e){
        AUTH.salir();
        return msg.innerHTML=`<div class="warnbox">${esc(e.message==='SESION_VENCIDA'?'Este equipo no está autorizado.':e.message)}</div>`;
      }
      pedirPinNuevo();
    };
    g('#lOk').onclick=entrar;
    g('#lPass').addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); });
    g('#lCfg').onclick=()=>showGate('activar');
    return;
  }

  /* ---------- Paso 3: PIN del día a día ---------- */
  if(paso==='pin'){
    let sess={}; try{ sess=JSON.parse(localStorage.getItem(LS.sess)||'{}'); }catch{}
    b.innerHTML=`
      <p class="sub">Hola${sess.nombre?', <b>'+esc(sess.nombre)+'</b>':''}. Ingresa tu PIN.</p>
      <input id="pIn" type="password" inputmode="numeric" maxlength="8"
             style="text-align:center;font-size:26px;letter-spacing:10px" autofocus>
      <div id="pMsg"></div>
      <button class="btn p w" id="pOk" style="margin-top:12px">Entrar</button>
      <button class="btn w" id="pOtro" style="margin-top:8px">Entrar con otra cuenta</button>`;
    const inp=g('#pIn'), msg=g('#pMsg');
    const probar=async()=>{
      const pin=inp.value.trim(); inp.value='';
      const rt=await abrirSello(pin, sess.blob||{});
      if(!rt){
        sess.fallos=(sess.fallos||0)+1;
        if(sess.fallos>=5){
          localStorage.removeItem(LS.sess);
          return showGate('login',{aviso:'Demasiados intentos. Vuelve a entrar con tu usuario y contraseña.'});
        }
        localStorage.setItem(LS.sess,JSON.stringify(sess));
        msg.innerHTML=`<div class="warnbox">PIN incorrecto. Te quedan ${5-sess.fallos} intentos.</div>`;
        return;
      }
      msg.innerHTML='<div class="infobox">Entrando…</div>';
      try{
        await AUTH.renovar(rt);
        await AUTH.ficha();
        if(!AUTH.sesion.activo){ AUTH.salir(); return showGate('login',{aviso:'Tu acceso fue retirado. Consulta con la administradora.'}); }
        if(!await API.equipoActivo()){ AUTH.salir(); return showGate('login',{aviso:'Este equipo ya no está autorizado.'}); }
      }catch(e){
        AUTH.salir();
        return showGate('login',{aviso:'Hay que entrar de nuevo con usuario y contraseña.'});
      }
      // El token de acceso rota en cada renovación: se vuelve a sellar con el mismo PIN.
      sess.fallos=0; sess.blob=await sellar(pin, AUTH.sesion.refresh_token);
      sess.nombre=AUTH.sesion.nombre||AUTH.sesion.email;
      localStorage.setItem(LS.sess,JSON.stringify(sess));
      await arrancar();
    };
    g('#pOk').onclick=probar;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') probar(); });
    g('#pOtro').onclick=()=>{ localStorage.removeItem(LS.sess); AUTH.salir(); showGate('login'); };
    setTimeout(()=>inp.focus(),100);
    return;
  }
}

/* Pide un PIN nuevo y sella con él el acceso de esta persona en este equipo. */
function pedirPinNuevo(){
  const b=document.getElementById('gateBody');
  b.innerHTML=`
    <p class="sub">Listo, <b>${esc(AUTH.sesion.nombre||AUTH.sesion.email)}</b>.
    Elige un PIN de 4 a 8 dígitos: es lo único que te pedirá al abrir la app.</p>
    <input id="n1" type="password" inputmode="numeric" maxlength="8"
           style="text-align:center;font-size:26px;letter-spacing:10px" placeholder="PIN">
    <input id="n2" type="password" inputmode="numeric" maxlength="8" style="text-align:center;font-size:26px;letter-spacing:10px;margin-top:8px" placeholder="Repite el PIN">
    <div id="nMsg"></div>
    <button class="btn p w" id="nOk" style="margin-top:12px">Guardar y entrar</button>`;
  const msg=b.querySelector('#nMsg');
  b.querySelector('#nOk').onclick=async()=>{
    const a=b.querySelector('#n1').value.trim(), c=b.querySelector('#n2').value.trim();
    if(!/^\d{4,8}$/.test(a)) return msg.innerHTML='<div class="warnbox">El PIN debe tener de 4 a 8 dígitos.</div>';
    if(a!==c) return msg.innerHTML='<div class="warnbox">Los dos PIN no coinciden.</div>';
    localStorage.setItem(LS.sess, JSON.stringify({
      nombre: AUTH.sesion.nombre||AUTH.sesion.email, fallos:0,
      blob: await sellar(a, AUTH.sesion.refresh_token)
    }));
    localStorage.removeItem(LS.cache);
    STATE={lastPull:null,loaded:false}; saveState();
    await arrancar();
  };
  setTimeout(()=>b.querySelector('#n1').focus(),100);
}

/* La sesión se cayó o fue revocada mientras la app estaba abierta. */
let _cayendo=false;
function sesionCaida(){
  if(_cayendo) return; _cayendo=true;
  AUTH.salir();
  closeSheet();
  showGate(localStorage.getItem(LS.sess)?'pin':'login',{aviso:'Tu sesión se cerró. Vuelve a entrar.'});
  setTimeout(()=>_cayendo=false,1000);
}

/* =====================================================================
   CLAVE DE LAS PANTALLAS INTERNAS (la misma del programa)
   ===================================================================== */
let INTERNO_ABIERTO=false;
function pedirClaveInterna(alEntrar){
  openSheet('Acceso interno', `
    <p class="sub">Ingresa la clave para las opciones internas.</p>
    <input id="ci" type="password" style="text-align:center;font-size:22px;letter-spacing:6px">
    <div id="ciMsg"></div>
    <div class="sticky-actions">
      <button class="btn" data-no>Cerrar</button>
      <button class="btn p" data-si>Entrar</button>
    </div>`, ovl=>{
    const inp=ovl.querySelector('#ci'), msg=ovl.querySelector('#ciMsg');
    const probar=async()=>{
      if(await sha256(inp.value.trim())===CLAVE_INTERNA_HASH){
        INTERNO_ABIERTO=true; closeSheet(); alEntrar();
      }else{
        msg.innerHTML='<div class="warnbox">Clave incorrecta.</div>'; inp.value=''; inp.focus();
      }
    };
    ovl.querySelector('[data-si]').onclick=probar;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') probar(); });
    ovl.querySelector('[data-no]').onclick=()=>{ closeSheet(); };
    setTimeout(()=>inp.focus(),120);
  });
}

/* =====================================================================
   AJUSTES
   ===================================================================== */
function verAjustes(){
  const s=AUTH.sesion||{};
  openSheet('Ajustes', `
    <div class="card" style="margin:0 0 10px">
      <div class="row" style="justify-content:space-between"><span class="sub">Persona</span><b>${esc(s.nombre||s.email||'—')}</b></div>
      <div class="row" style="justify-content:space-between"><span class="sub">Rol</span><b>${s.rol==='admin'?'Administradora':'Personal'}</b></div>
      <div class="row" style="justify-content:space-between"><span class="sub">Equipo</span><b>${esc(CFG.deviceName||'—')}</b></div>
      <div class="row" style="justify-content:space-between"><span class="sub">Modo</span><b>${SOLO_LECTURA?'Solo lectura':'Lectura y registro'}</b></div>
      <div class="row" style="justify-content:space-between"><span class="sub">Historial</span><b>${CFG.dias||120} días</b></div>
    </div>
    <div class="grid g2">
      <button class="btn" data-pin>Cambiar mi PIN</button>
      <button class="btn" data-dias>Días de historial</button>
      ${AUTH.esAdmin()?'<button class="btn" data-equipos>Equipos autorizados</button>':''}
      <button class="btn" data-salir>Cerrar sesión</button>
    </div>
    ${AUTH.esAdmin()?'<button class="btn w d" data-conexion style="margin-top:8px">Cambiar conexión / activar equipo</button>':''}
    <p class="sub" style="margin-top:10px">Para dar de alta o quitar personas se usa Supabase
    (Authentication → Users) y el archivo <b>SUPABASE_1_SEGURIDAD.sql</b>.</p>`, ovl=>{
    ovl.querySelector('[data-pin]').onclick=()=>{ closeSheet(); cambiarPin(); };
    ovl.querySelector('[data-dias]').onclick=()=>{ closeSheet(); cambiarDias(); };
    ovl.querySelector('[data-salir]').onclick=()=>{
      localStorage.removeItem(LS.sess); AUTH.salir(); closeSheet(); showGate('login');
    };
    const eq=ovl.querySelector('[data-equipos]');
    if(eq) eq.onclick=()=>{ closeSheet(); verEquipos(); };
    const cx=ovl.querySelector('[data-conexion]');
    if(cx) cx.onclick=()=>{ closeSheet(); showGate('activar'); };
  });
}
function cambiarPin(){
  openSheet('Cambiar PIN', `
    <input id="q1" type="password" inputmode="numeric" maxlength="8" placeholder="PIN nuevo" style="text-align:center;font-size:24px;letter-spacing:8px">
    <input id="q2" type="password" inputmode="numeric" maxlength="8" placeholder="Repite el PIN" style="text-align:center;font-size:24px;letter-spacing:8px;margin-top:8px">
    <div id="qMsg"></div>
    <div class="sticky-actions"><button class="btn" data-no>Cancelar</button><button class="btn p" data-si>Guardar</button></div>`, ovl=>{
    ovl.querySelector('[data-no]').onclick=closeSheet;
    ovl.querySelector('[data-si]').onclick=async()=>{
      const a=ovl.querySelector('#q1').value.trim(), c=ovl.querySelector('#q2').value.trim();
      const msg=ovl.querySelector('#qMsg');
      if(!/^\d{4,8}$/.test(a)) return msg.innerHTML='<div class="warnbox">De 4 a 8 dígitos.</div>';
      if(a!==c) return msg.innerHTML='<div class="warnbox">No coinciden.</div>';
      let sess={}; try{ sess=JSON.parse(localStorage.getItem(LS.sess)||'{}'); }catch{}
      sess.blob=await sellar(a, AUTH.sesion.refresh_token); sess.fallos=0;
      sess.nombre=AUTH.sesion.nombre||AUTH.sesion.email;
      localStorage.setItem(LS.sess,JSON.stringify(sess));
      closeSheet(); toast('PIN actualizado');
    };
  });
}
function cambiarDias(){
  openSheet('Días de historial', `
    <p class="sub">Cuántos días de citas, caja y almacén se descargan al abrir.
    Menos días = más rápido en el celular.</p>
    <input type="number" id="dd" value="${CFG.dias||120}" min="7" max="1095">
    <div class="sticky-actions"><button class="btn" data-no>Cancelar</button><button class="btn p" data-si>Guardar</button></div>`, ovl=>{
    ovl.querySelector('[data-no]').onclick=closeSheet;
    ovl.querySelector('[data-si]').onclick=async()=>{
      CFG.dias=Math.min(1095,Math.max(7,parseInt(ovl.querySelector('#dd').value,10)||120));
      saveCfg(); localStorage.removeItem(LS.cache);
      STATE={lastPull:null,loaded:false}; saveState();
      TABLES.forEach(t=>DB[t]=new Map()); tocarDatos();
      closeSheet(); toast('Descargando de nuevo…'); SYNC.now();
    };
  });
}
async function verEquipos(){
  let lista=[];
  try{ lista=await API.tabla('adhuliav_web_dispositivos','select=device_id,nombre,activo,creado_at&order=creado_at.desc'); }
  catch(e){ return toast('No se pudo leer: '+e.message); }
  openSheet('Equipos autorizados', `
    <p class="sub">Si se pierde un celular, quítale el permiso aquí: deja de leer al instante,
    aunque tenga la clave guardada.</p>
    <div class="list">${lista.map(d=>`
      <div class="item" style="cursor:default">
        <div class="t"><b>${esc(d.nombre||'(sin nombre)')}${d.device_id===CFG.deviceId?' · <span class="badge b-gold">este</span>':''}</b>
          <span>desde ${fechaCorta((d.creado_at||'').slice(0,10))}</span></div>
        <div class="r"><button class="btn s" data-eq="${esc(d.device_id)}" data-act="${d.activo?0:1}">
          ${d.activo?'Quitar permiso':'Volver a permitir'}</button></div>
      </div>`).join('')||'<div class="empty">Sin equipos registrados.</div>'}</div>`, ovl=>{
    ovl.querySelectorAll('[data-eq]').forEach(btn=>btn.onclick=async()=>{
      const activo=btn.dataset.act==='1';
      if(btn.dataset.eq===CFG.deviceId && !activo)
        return confirmar('Vas a quitarle el permiso a ESTE equipo. Tendrás que activarlo otra vez para volver a entrar. ¿Seguro?',
          async()=>{ await cambiarEquipo(btn.dataset.eq,false); });
      await cambiarEquipo(btn.dataset.eq,activo);
    });
  });
}
async function cambiarEquipo(id,activo){
  try{
    await API.actualizar('adhuliav_web_dispositivos','device_id=eq.'+encodeURIComponent(id),{activo});
    closeSheet(); toast(activo?'Equipo permitido':'Permiso retirado');
    if(id===CFG.deviceId && !activo) sesionCaida();
  }catch(e){ toast('No se pudo cambiar: '+e.message); }
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
async function arrancar(){
  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.body.classList.toggle('ro', SOLO_LECTURA);
  loadState();
  const tuvoCache=loadCache();
  UI.spa=(CFG.spa&&SPAS.includes(CFG.spa))?CFG.spa:'Adhamar';
  const sel=document.getElementById('spaSel');
  sel.innerHTML=SPAS.map(s=>`<option ${s===UI.spa?'selected':''}>${s}</option>`).join('');
  sel.onchange=()=>{ UI.spa=sel.value; CFG.spa=UI.spa; saveCfg(); render(); };
  document.getElementById('quien').textContent=(AUTH.sesion&&(AUTH.sesion.nombre||AUTH.sesion.email))||'';
  VIEW='agenda'; INTERNO_ABIERTO=false;
  render();
  if(!tuvoCache) SYNC.setStatus('busy');
  await SYNC.now();
  SYNC.start();
  render();
}

/* Igual que el programa: la agenda es libre; el resto pide la clave interna,
   y al volver a la agenda se vuelve a cerrar. */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  const destino=b.dataset.v;
  const ir=()=>{ VIEW=destino; window.scrollTo(0,0); render(); };
  if(VISTAS_LIBRES.includes(destino)){ INTERNO_ABIERTO=false; return ir(); }
  if(INTERNO_ABIERTO) return ir();
  pedirClaveInterna(ir);
});
document.getElementById('btnSync').onclick=()=>{ SYNC.now(); toast('Sincronizando…'); };
document.getElementById('btnCfg').onclick=verAjustes;

/* El navegador solo habilita el cifrado en un contexto seguro (https:// o un
   archivo abierto con doble clic). Si se abre desde una descarga de WhatsApp o
   desde un gestor de archivos de Android, la dirección es content:// y el
   cifrado queda apagado: sin él no se puede sellar el PIN ni guardar. Antes se
   rompía en silencio; ahora se avisa. */
if(!window.crypto || !window.crypto.subtle){
  document.getElementById('gate').classList.remove('hide');
  document.getElementById('gateBody').innerHTML=`
    <div class="warnbox">Este navegador abrió el archivo en un modo sin seguridad
      (${esc(location.protocol)}), y así no se puede proteger tu acceso.</div>
    <p class="sub">Soluciones, de la más fácil a la mejor:</p>
    <ul class="sub" style="padding-left:18px;line-height:1.7">
      <li><b>En la computadora:</b> abre el archivo con doble clic desde su carpeta,
          no desde la descarga del navegador.</li>
      <li><b>En el celular:</b> guarda el archivo en <i>Archivos</i> y ábrelo desde ahí
          con Chrome; si sigue igual, hay que publicarlo con un enlace https.</li>
      <li><b>Definitivo:</b> subir la página a un enlace https. Funciona en todos
          los aparatos y además siempre está actualizada.</li>
    </ul>
    <p class="sub">Dirección actual: <code>${esc(location.href.slice(0,80))}</code></p>`;
  throw new Error('contexto no seguro');
}

loadCfg();
if(!CFG||!CFG.url||!CFG.key||!CFG.activado) showGate('activar');
else if(localStorage.getItem(LS.sess)) showGate('pin');
else showGate('login');
</script>
